<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --hd-yellow: #ffe80a;
            --hd-red: #ff4d4d;
            --hd-bg: #222222;
            --hd-border: #333333;
            --hd-text: #ffffff;
            --hd-text-dark: #888888;
            --hd-dark-box: #161616;
            --space-md: 10px;
            --space-lg: 20px;
            --radius: 6px;
            --font-sm: 0.7rem;
            --font: 0.8rem;
            --font-lg: 1rem;
            --preset-tab-font: 1.25rem;
            --line-normal: 1.25;
            --selected-image-padding: 0px;
            --modal-slot-size: 120px;
            --modal-grid-image-size: 60px;
            --modal-weapon-image-width: 160px;
            --modal-weapon-image-height: 90px;
            --modal-square-image-size: 90px;
            --modal-width-scale: 0.8;
            --modal-height-scale: 0.8;
            --modal-width: calc(var(--stage-width) * var(--modal-width-scale));
            --modal-height: calc(var(--stage-height) * var(--modal-height-scale));
            --modal-scale: 1;
            --stage-width: 950px;
            --stage-height: 630px;
            --stage-padding: 20px;
            --design-width: 910px;
            --design-height: 590px;
            --design-gap: 10px;
            --main-panel-gap: 20px;
            --preset-tabs-gap: 20px;
            --sidebar-width: 250px;
            --left-width: 640px;
            --slot-size: 120px;
            --slots-height: 250px;
            --stratagem-slot-rows: 2;
            --loadout-height: 250px;
            --weapon-row-height: 120px;
            --armor-size: 250px;
            --weapons-width: 380px;
            --secondary-width: 250px;
            --grenade-size: 120px;
            --sub-weapon-gap: 10px;
            --ui-scale: 1;
        }

        :root.settings-panel-expanded {
            --stage-width: 1060px;
            --design-width: 1020px;
            --sidebar-width: 360px;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--hd-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--hd-yellow);
            border-radius: var(--radius);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--hd-bg);
            color: var(--hd-text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        *:focus,
        *:focus-visible {
            outline: none !important;
        }

        .modal-search-input {
            user-select: auto;
        }

        .top-main-layout {
            position: fixed;
            left: calc(var(--stage-padding) * var(--ui-scale));
            top: calc(var(--stage-padding) * var(--ui-scale));
            transform: scale(var(--ui-scale));
            transform-origin: top left;
            display: grid;
            grid-template-columns: var(--left-width) var(--sidebar-width);
            grid-template-rows: auto minmax(0, 1fr);
            gap: var(--main-panel-gap);
            row-gap: var(--preset-tabs-gap);
            width: var(--design-width);
            height: var(--design-height);
            max-width: none;
            max-height: none;
            margin: 0;
        }

        .left-workspace {
            display: grid;
            grid-template-rows: var(--slots-height) auto var(--loadout-height);
            gap: var(--design-gap);
            height: 100%;
            min-height: 0;
        }

        .equipment-preset-section {
            min-width: 0;
            position: relative;
        }

        .equipment-preset-section .preset-tabs-bar {
            min-height: 26px;
            grid-column: auto;
        }

        .equipment-preset-section .preset-tabs-selected-rule {
            top: calc(var(--preset-tab-font) + 1px);
        }

        .preset-tabs-bar {
            box-sizing: border-box;
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: var(--space-lg);
            min-width: 0;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            user-select: none;
        }

            .preset-tabs-bar::-webkit-scrollbar {
                display: none;
            }

        .preset-tabs-selected-rule {
            position: absolute;
            top: calc(var(--preset-tab-font) + (var(--preset-tabs-gap) / 2) - 1px);
            left: var(--preset-selected-rule-left, 0);
            width: var(--preset-selected-rule-width, 0);
            height: 2px;
            background: var(--hd-yellow);
            display: var(--preset-selected-rule-display, none);
            pointer-events: none;
            z-index: 2;
        }

        .preset-tab {
            align-items: center;
            background: transparent;
            border: 0;
            box-sizing: border-box;
            color: var(--hd-text);
            cursor: pointer;
            display: flex;
            flex: 0 0 auto;
            font-size: var(--preset-tab-font);
            font-weight: bold;
            justify-content: center;
            line-height: 1;
            min-width: auto;
            outline: none;
            padding: 0;
            position: relative;
            text-align: center;
            transition: color 0.15s ease;
            white-space: nowrap;
        }

            .preset-tab[draggable="true"] {
                cursor: grab;
            }

            .preset-tab:hover {
                color: var(--hd-yellow);
            }

            .preset-tab.selected {
                color: var(--hd-yellow);
            }

            .preset-tab.add {
                min-width: auto;
            }

            .preset-tab.dragging {
                color: var(--hd-yellow);
                cursor: grabbing;
                opacity: 0.5;
            }

        .preset-drag-shield {
            position: fixed;
            z-index: 10000;
            background: transparent;
        }

        .stratagem-slots-container {
            display: grid;
            grid-template-columns: repeat(5, var(--slot-size));
            grid-template-rows: repeat(var(--stratagem-slot-rows), var(--slot-size));
            gap: var(--design-gap);
            min-height: 0;
        }

        .slot {
            background: var(--hd-bg);
            border: 2px solid var(--hd-border);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            transition: border-color 0.15s ease;
            outline: none;
            aspect-ratio: 1 / 1;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
        }

            .slot:hover {
                border-color: var(--hd-yellow);
            }

            /* Shift+클릭으로 저장한 오버레이 휠 표시 상태를 슬롯 테두리로 바로 구분한다. */
            .slot.overlay-visible {
                border-color: #28c76f;
            }

            .slot.overlay-hidden {
                border-color: #e05252;
            }

            .slot.overlay-visible:hover,
            .slot.overlay-hidden:hover {
                border-color: var(--hd-yellow);
            }

            .slot:has(img) {
                cursor: grab;
            }

                .slot:has(img):active {
                    cursor: grabbing;
                }

            .slot.dragging {
                opacity: 0.5;
                border-style: dashed;
                border-color: var(--hd-yellow);
            }

            .slot img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                pointer-events: none;
            }

        .slot-label {
            margin: 0;
            color: var(--hd-text-dark);
            font-size: var(--font);
            line-height: 1;
            position: absolute;
            top: var(--space-md);
            left: var(--space-md);
            z-index: 2;
            pointer-events: none;
        }

        .slot:has(img) .slot-label {
            display: none;
        }

        .slot .plus-icon {
            font-size: var(--font);
            color: var(--hd-text);
            pointer-events: none;
        }

        .my-loadout-panel {
            display: grid;
            grid-template-columns: var(--armor-size) var(--weapons-width);
            gap: var(--design-gap);
            justify-content: start;
            min-height: 0;
            align-items: stretch;
        }

        .loadout-box.box-armor {
            aspect-ratio: 1 / 1;
            width: 100%;
            height: 100%;
            justify-self: center;
            align-self: center;
        }

        .right-weapons-column {
            display: grid;
            grid-template-rows: var(--weapon-row-height) var(--weapon-row-height);
            align-content: stretch;
            gap: var(--design-gap);
            height: 100%;
            min-height: 0;
        }

        .primary-grenade-row {
            display: grid;
            grid-template-columns: var(--secondary-width) var(--grenade-size);
            gap: var(--sub-weapon-gap);
            height: 100%;
            min-height: 0;
            align-items: center;
            justify-content: start;
        }

        .sub-weapons-row {
            display: grid;
            grid-template-columns: var(--secondary-width) var(--grenade-size);
            gap: var(--sub-weapon-gap);
            height: 100%;
            min-height: 0;
            align-items: center;
            justify-content: start;
        }

        .loadout-box.box-primary {
            width: var(--secondary-width);
            height: 100%;
        }

        .loadout-box.box-secondary {
            width: var(--secondary-width);
            height: 100%;
        }

        .loadout-box.box-grenade {
            width: var(--grenade-size);
            height: var(--grenade-size);
        }

        .loadout-actions-stack {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: var(--design-gap);
            width: var(--grenade-size);
            height: 100%;
            min-height: 0;
        }

        .loadout-action-btn {
            background: var(--hd-bg);
            border: 2px solid var(--hd-border);
            border-radius: var(--radius);
            color: var(--hd-text);
            cursor: pointer;
            font-size: var(--font-lg);
            font-weight: bold;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

            .loadout-action-btn:hover {
                border-color: var(--hd-yellow);
            }

            .loadout-action-btn.saved-feedback {
                color: var(--hd-yellow);
            }

        .loadout-box {
            background: var(--hd-bg);
            border: 2px solid var(--hd-border);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            box-sizing: border-box;
            overflow: hidden;
            outline: none;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            transition: border-color 0.15s ease;
        }

            .loadout-box:hover {
                border-color: var(--hd-yellow);
            }

            .loadout-box h4 {
                margin: 0;
                color: var(--hd-text-dark);
                font-size: var(--font);
                font-weight: normal;
                line-height: 1;
                position: absolute;
                top: var(--space-md);
                left: var(--space-md);
                z-index: 2;
                pointer-events: none;
            }

            .loadout-box:has(.selected-info img) h4 {
                display: none;
            }

            .loadout-box .selected-info {
                width: var(--item-frame-width, 100%);
                height: var(--item-frame-height, 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                pointer-events: none;
                padding: var(--space-md);
                box-sizing: border-box;
            }

            .loadout-box.box-grenade .selected-info {
                --item-frame-width: var(--grenade-size);
                --item-frame-height: var(--grenade-size);
            }

            .loadout-box .selected-info:has(img) {
                padding: var(--selected-image-padding);
            }

            .loadout-box .selected-info img {
                width: 100%;
                height: 100%;
                max-width: 100%;
                max-height: 100%;
                display: block;
                object-fit: contain;
            }

            .loadout-box .empty-plus {
                font-size: var(--font);
                color: var(--hd-text);
            }

        .right-sidebar-panel {
            display: grid;
            grid-template-rows: 1fr;
            height: 100%;
            min-height: 0;
        }

        .box-settings {
            background: var(--hd-bg);
            border: 2px solid var(--hd-border);
            border-radius: var(--radius);
            padding: var(--space-md);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
            height: 100%;
        }
            .box-settings h4 {
                margin: 0;
                color: var(--hd-text);
                font-size: var(--font-lg);
                line-height: 1;
            }

        .settings-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 32px;
            align-items: center;
            gap: var(--space-md);
            margin: 0 0 var(--space-md) 0;
        }

        .settings-collapse-btn {
            width: 28px;
            height: 28px;
            border: 1px solid var(--hd-border);
            border-radius: var(--radius);
            background: var(--hd-dark-box);
            color: var(--hd-yellow);
            cursor: pointer;
            font-size: var(--font-lg);
            line-height: 1;
            padding: 0;
        }

        .settings-collapse-btn:hover {
            border-color: var(--hd-yellow);
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        #slot-key-settings {
            display: contents;
        }

        .setting-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 92px;
            align-items: center;
            gap: var(--space-md);
            min-height: 0;
            background: var(--hd-bg);
            box-sizing: border-box;
            cursor: pointer;
            position: relative;
            padding: var(--space-md) 0 var(--space-md) calc(2px + var(--space-md));
        }

            .setting-row::after {
                content: "";
                position: absolute;
                left: 0;
                top: 50%;
                width: 2px;
                height: var(--font);
                background: var(--hd-border);
                transform: translateY(-50%);
                transition: background-color 0.15s ease;
            }

            .setting-row:hover::after,
            .setting-row.waiting::after {
                background: var(--hd-yellow);
            }

        .setting-label {
            color: var(--hd-text-dark);
            font-size: var(--font);
            grid-column: 1;
            line-height: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .setting-key-btn,
        .setting-value-btn {
            background: transparent;
            border: 0;
            color: var(--hd-text);
            box-sizing: border-box;
            font-size: var(--font);
            grid-column: 2;
            line-height: 1;
            cursor: pointer;
            overflow: hidden;
            padding: 0;
            text-align: right;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .setting-row.waiting .setting-key-btn {
            color: var(--hd-yellow);
        }

        .settings-subtitle {
            margin: var(--space-sm) 0 0 0;
            padding-top: var(--space-md);
            border-top: 1px solid var(--hd-border);
            color: var(--hd-yellow);
            font-size: var(--font);
            line-height: 1;
        }

        .manual-stratagem-toggle {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 64px;
            align-items: center;
            gap: var(--space-sm);
            width: 100%;
            border: 0;
            border-top: 1px solid var(--hd-border);
            background: transparent;
            color: var(--hd-yellow);
            cursor: pointer;
            font-size: var(--font);
            line-height: 1.2;
            padding: var(--space-md) 0 0 0;
            text-align: left;
        }

        .manual-stratagem-toggle-copy {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .manual-stratagem-toggle-hint {
            color: var(--hd-text-dark);
            font-size: var(--font-sm);
        }

        .manual-stratagem-toggle-state {
            color: var(--hd-text);
            font-size: var(--font-sm);
            text-align: right;
        }

        .manual-stratagem-key-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .manual-stratagem-key-list[hidden] {
            display: none;
        }

        .crosshair-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 120px;
            align-items: center;
            gap: var(--space-sm);
            padding-left: calc(2px + var(--space-md));
        }

        .crosshair-control {
            width: 100%;
            min-width: 0;
            accent-color: var(--hd-yellow);
        }

            .crosshair-control[type="color"] {
                height: 24px;
                padding: 0;
                border: 1px solid var(--hd-border);
                background: transparent;
            }

        .crosshair-select {
            background: var(--hd-bg);
            border: 1px solid var(--hd-border);
            color: var(--hd-text);
            font-size: var(--font);
            height: 24px;
        }

        .crosshair-editor-dialog {
            width: min(980px, 96vw);
            height: min(720px, 92vh);
            overflow: hidden;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
        }

        #crosshair-editor-modal {
            align-items: stretch;
            justify-content: center;
            padding: 12px;
            box-sizing: border-box;
        }

        .crosshair-editor-body {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: var(--space-lg);
            min-height: 0;
            overflow: hidden;
        }

        .crosshair-preview {
            --preview-scale: 1;
            --dot-size: 6px;
            --dot-thickness: 2px;
            --dot-color: #00FF66;
            --dot-opacity: 1;
            --line-gap: 10px;
            --line-length: 18px;
            --line-thickness: 3px;
            --line-color: #00FF66;
            --line-opacity: 1;
            --outline-thickness: 0px;
            --outline-color: rgba(0,0,0,1);
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            background:
                linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,0.12) 50%, transparent calc(50% + 1px)),
                linear-gradient(0deg, transparent calc(50% - 1px), rgba(255,255,255,0.12) 50%, transparent calc(50% + 1px)),
                rgba(0, 0, 0, 0.42);
            border: 1px solid var(--hd-border);
            box-sizing: border-box;
        }

        .crosshair-preview-line,
        .crosshair-preview-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            pointer-events: none;
        }

        .crosshair-preview-line.horizontal {
            width: var(--line-length);
            height: var(--line-thickness);
            margin-top: calc(var(--line-thickness) / -2);
            background: var(--line-color);
            opacity: var(--line-opacity);
            box-shadow: 0 0 0 var(--outline-thickness) var(--outline-color);
        }

            .crosshair-preview-line.horizontal.left {
                transform: translateX(calc(-1 * var(--line-gap) - var(--line-length)));
            }

            .crosshair-preview-line.horizontal.right {
                transform: translateX(var(--line-gap));
            }

        .crosshair-preview-line.vertical {
            width: var(--line-thickness);
            height: var(--line-length);
            margin-left: calc(var(--line-thickness) / -2);
            background: var(--line-color);
            opacity: var(--line-opacity);
        }

            .crosshair-preview-line.vertical.top {
                transform: translateY(calc(-1 * var(--line-gap) - var(--line-length)));
            }

            .crosshair-preview-line.vertical.bottom {
                transform: translateY(var(--line-gap));
            }

        .crosshair-preview-dot {
            width: var(--dot-size);
            height: var(--dot-size);
            margin-left: calc(var(--dot-size) / -2);
            margin-top: calc(var(--dot-size) / -2);
            border: var(--dot-thickness) solid var(--dot-color);
            border-radius: 50%;
            box-sizing: border-box;
            opacity: var(--dot-opacity);
            box-shadow: 0 0 0 var(--outline-thickness) var(--outline-color);
        }

            .crosshair-preview-dot.filled {
                background: var(--dot-color);
            }

            .crosshair-preview-dot.none {
                display: none;
            }

        .crosshair-editor-controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--space-md);
            max-height: none;
            min-height: 0;
            overflow-y: auto;
            padding-right: var(--space-sm);
        }

            .crosshair-editor-controls .crosshair-row {
                grid-template-columns: 1fr;
                align-items: stretch;
                gap: var(--space-xs);
                padding-left: 0;
            }

            .crosshair-editor-controls .setting-label {
                white-space: normal;
                line-height: 1.25;
            }

        .crosshair-control-line {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 58px;
            gap: var(--space-sm);
            align-items: center;
        }

        .crosshair-number {
            width: 100%;
            min-width: 0;
            height: 24px;
            box-sizing: border-box;
            background: var(--hd-bg);
            border: 1px solid var(--hd-border);
            color: var(--hd-text);
            font-size: var(--font);
            text-align: right;
            padding: 0 4px;
        }

        @media (max-width: 820px) {
            .crosshair-editor-body {
                grid-template-columns: 1fr;
                overflow-y: auto;
            }

            .crosshair-editor-controls {
                grid-template-columns: 1fr;
                overflow-y: visible;
            }
        }

        .preset-rename-inline {
            display: inline-block;
            flex: 0 0 auto;
            max-width: 100%;
            min-width: 0;
            width: var(--preset-rename-width, 100px);
            background: transparent;
            border: 0;
            color: var(--hd-text);
            font: inherit;
            font-weight: inherit;
            line-height: inherit;
            margin: 0;
            vertical-align: baseline;
            box-sizing: border-box;
            outline: none;
            padding: 0;
            overflow: hidden;
            text-overflow: clip;
            user-select: auto;
            white-space: nowrap;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 999;
        }

        #confirm-modal {
            z-index: 1001;
        }

        .modal-content {
            position: absolute;
            left: 50%;
            top: 50%;
            width: var(--modal-width);
            height: var(--modal-height);
            max-width: none;
            max-height: none;
            transform: translate(-50%, -50%) scale(var(--modal-scale));
            transform-origin: center center;
            background: var(--hd-bg);
            border: 2px solid var(--hd-border);
            border-radius: var(--radius);
            display: flex;

    <script>
        function updateUiScale() {
            const root = document.documentElement;
            const styles = getComputedStyle(root);
            const stageWidth = parseFloat(styles.getPropertyValue('--stage-width')) || 950;
            const stageHeight = parseFloat(styles.getPropertyValue('--stage-height')) || 590;
            const modalWidthScale = parseFloat(styles.getPropertyValue('--modal-width-scale')) || 0.8;
            const modalHeightScale = parseFloat(styles.getPropertyValue('--modal-height-scale')) || 0.8;

            const scale = Math.max(0.1, Math.min(
                window.innerWidth / stageWidth,
                window.innerHeight / stageHeight
            ));

            root.style.setProperty('--ui-scale', scale.toString());
            root.style.setProperty('--modal-scale', scale.toString());
            root.style.setProperty('--modal-width', `${stageWidth * modalWidthScale}px`);
            root.style.setProperty('--modal-height', `${stageHeight * modalHeightScale}px`);
        }

        window.addEventListener('resize', () => {
            updateUiScale();
            updatePresetSelectedRule();
        });
        window.addEventListener('load', () => {
            setTimeout(() => document.activeElement?.blur(), 0);
            renderPresetTabs();
        });
        document.addEventListener('dragover', handleDocumentPresetDragOver);
        document.addEventListener('drop', handleDocumentPresetDrop);
        document.addEventListener('dragover', handleDocumentModalSlotDragOver);

        function preloadImage(src) {
            if (!src || loadedImageUrls.has(src)) return Promise.resolve();
            if (pendingImageLoads.has(src)) return pendingImageLoads.get(src);

            const promise = new Promise(resolve => {
                const image = new Image();
                image.onload = async () => {
                    try {
                        if (image.decode) await image.decode();
                    } catch {
                    }
                    loadedImageUrls.add(src);
                    pendingImageLoads.delete(src);
                    resolve();
                };
                image.onerror = () => {
                    pendingImageLoads.delete(src);
                    resolve();
                };
                image.src = src;
            });

            pendingImageLoads.set(src, promise);
            return promise;
        }

        function preloadImages(sources) {
            return Promise.all([...new Set(sources.filter(Boolean))].map(preloadImage));
        }

        function loadImageElement(src) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = reject;
                image.src = src;
            });
        }

        function shouldUseTransparentImage(type) {
            return ['방어구', '주 무기', '보조 무기', '투척 무기'].includes(type);
        }

        async function getTransparentImageUrl(src) {
            if (!src) return '';
            if (transparentImageUrls.has(src)) return transparentImageUrls.get(src);
            if (pendingTransparentImageLoads.has(src)) return pendingTransparentImageLoads.get(src);

            const promise = (async () => {
                const image = await loadImageElement(src);
                const width = image.naturalWidth || image.width;
                const height = image.naturalHeight || image.height;
                if (!width || !height) throw new Error(`Invalid image size: ${src}`);

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const context = canvas.getContext('2d', { willReadFrequently: true });
                if (!context) throw new Error(`Canvas unavailable: ${src}`);

                context.drawImage(image, 0, 0);
                const imageData = context.getImageData(0, 0, width, height);
                const pixels = imageData.data;

                for (let i = 0; i < pixels.length; i += 4) {
                    if (pixels[i] === 0 && pixels[i + 1] === 0 && pixels[i + 2] === 0 && pixels[i + 3] !== 0) {
                        pixels[i + 3] = 0;
                    }
                }

                context.putImageData(imageData, 0, 0);
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                if (!blob) throw new Error(`Blob unavailable: ${src}`);

                const url = URL.createObjectURL(blob);
                transparentImageUrls.set(src, url);
                pendingTransparentImageLoads.delete(src);
                image.src = '';
                canvas.width = 0;
                canvas.height = 0;
                return url;
            })();

            promise.catch(() => pendingTransparentImageLoads.delete(src));
            pendingTransparentImageLoads.set(src, promise);
            return promise;
        }

        function getCachedDisplayImageUrl(type, name) {

        async function warmupTransparentEquipmentImages(data) {
            if (!data) return;

            const urls = [];
            ['방어구', '주 무기', '보조 무기', '투척 무기'].forEach(type => {
                Object.values(data[type] || {}).forEach(items => {
                    if (!Array.isArray(items)) return;
                    items.forEach(item => {
                        if (item?.Name) urls.push(getItemImageUrl(type, item.Name));
                    });
                });
            });

            const displayUrls = (await Promise.allSettled([...new Set(urls)].map(getTransparentImageUrl)))
                .filter(result => result.status === 'fulfilled')
                .map(result => result.value);
            await preloadImages(displayUrls);
        }

                if (item?.Name) staticUrls.push(`https://hd2.local/images/passives/${item.Name}.png`);

        function normalizeCrosshairSettings(settings = {}) {
            const read = (camel, pascal) => settings[camel] ?? settings[pascal];
            const clamp = (value, min, max, fallback) => {
                const number = Number(value ?? fallback);
                const safe = Number.isFinite(number) ? number : fallback;
                return Math.max(min, Math.min(max, safe));
            };
            const normalizeColor = (value, fallback) => /^#[0-9a-fA-F]{6}$/.test(String(value || '')) ? String(value).toUpperCase() : fallback;

            return {
                enabled: Boolean(read('enabled', 'Enabled')),
                // 우클릭 조준 표시 옵션은 실제 조준점 모양과 별개로 오버레이 표시 조건만 바꾼다.
                showOnlyWhileRightMouseButtonHeld: Boolean(read('showOnlyWhileRightMouseButtonHeld', 'ShowOnlyWhileRightMouseButtonHeld')),
                nonAimingOpacity: clamp(read('nonAimingOpacity', 'NonAimingOpacity'), 0, 100, 0),
                overallSize: clamp(read('overallSize', 'OverallSize'), 50, 200, 100),
                dotStyle: ['filled', 'hollow', 'none'].includes(read('dotStyle', 'DotStyle')) ? read('dotStyle', 'DotStyle') : 'filled',
                dotSize: clamp(read('dotSize', 'DotSize'), 1, 80, 6),
                dotThickness: clamp(read('dotThickness', 'DotThickness'), 1, 30, 2),
                dotColor: normalizeColor(read('dotColor', 'DotColor'), '#00FF66'),
                dotOpacity: clamp(read('dotOpacity', 'DotOpacity'), 0, 100, 100),
                crosshairGap: clamp(read('crosshairGap', 'CrosshairGap'), 0, 100, 10),
                crosshairLength: clamp(read('crosshairLength', 'CrosshairLength'), 1, 120, 18),
                crosshairThickness: clamp(read('crosshairThickness', 'CrosshairThickness'), 1, 40, 3),
                crosshairColor: normalizeColor(read('crosshairColor', 'CrosshairColor'), '#00FF66'),
                crosshairOpacity: clamp(read('crosshairOpacity', 'CrosshairOpacity'), 0, 100, 100),
                outlineThickness: clamp(read('outlineThickness', 'OutlineThickness'), 0, 40, 0),
                outlineColor: normalizeColor(read('outlineColor', 'OutlineColor'), '#000000'),
                outlineOpacity: clamp(read('outlineOpacity', 'OutlineOpacity'), 0, 100, 100)
            };
        }

                const wrapper = document.createElement('div');

                number.className = 'crosshair-number';

                number.min = range.min;

        function normalizeSupportWeaponSettings(settings = {}) {
            const read = (camel, pascal) => settings[camel] ?? settings[pascal];
            const clamp = (value, min, max, fallback) => {
                const number = Number(value ?? fallback);
                const safe = Number.isFinite(number) ? number : fallback;
                return Math.max(min, Math.min(max, safe));
            };
            const mode = String(read('mode', 'Mode') || 'Off');
            return {
                mode: ['Off', 'AutoFire', 'AutoRepeat', 'Danger'].includes(mode) ? mode : 'Off',
                // 진단 토글이 없는 기존 프리셋은 현재 동작을 유지하도록 둘 다 켠 상태로 해석한다.
                gaugeVisible: read('gaugeVisible', 'GaugeVisible') !== false,
                gaugeAlwaysRefresh: read('gaugeAlwaysRefresh', 'GaugeAlwaysRefresh') !== false,
                gaugeOpacity: clamp(read('gaugeOpacity', 'GaugeOpacity'), 0, 100, 85),
                gaugeOffsetX: clamp(read('gaugeOffsetX', 'GaugeOffsetX'), -500, 500, 0),
                gaugeOffsetY: clamp(read('gaugeOffsetY', 'GaugeOffsetY'), -500, 500, -72),
                gaugeVerticalMode: Boolean(read('gaugeVerticalMode', 'GaugeVerticalMode')),
                verticalGaugeOffsetX: clamp(read('verticalGaugeOffsetX', 'VerticalGaugeOffsetX'), -500, 500, 120),
                verticalGaugeOffsetY: clamp(read('verticalGaugeOffsetY', 'VerticalGaugeOffsetY'), -500, 500, 0),
                gaugeWidth: clamp(read('gaugeWidth', 'GaugeWidth'), 40, 800, 220),

                warningVolume: clamp(read('warningVolume', 'WarningVolume'), 0, 100, 60),

        }

        function normalizePresetSupportWeaponSettings(settings = {}) {
            const normalized = normalizeSupportWeaponSettings(settings || {});
            // 경고음 음량/파일은 전체 공통으로 남기고, 나머지 게이지/모드 값만 프리셋에 저장한다.
            return {
                mode: normalized.mode,

                gaugeOpacity: normalized.gaugeOpacity,

                gaugeOffsetY: normalized.gaugeOffsetY,

        function renderSupportWeaponSettings(settings) {
            currentSupportWeaponSettings = normalizeSupportWeaponSettings(settings);

                if (!(key in currentSupportWeaponSettings)) return;

                if (control.type === 'checkbox') {

                if (control.tagName === 'SELECT') {
                    control.value = currentSupportWeaponSettings[key];

                if (key === 'gaugeOffsetX') {
                    control.value = currentSupportWeaponSettings.gaugeVerticalMode
                        ? currentSupportWeaponSettings.verticalGaugeOffsetX
                        : currentSupportWeaponSettings.gaugeOffsetX;
                    return;
                }

                if (key === 'gaugeOffsetY') {
                    control.value = currentSupportWeaponSettings.gaugeVerticalMode
                        ? currentSupportWeaponSettings.verticalGaugeOffsetY
                        : currentSupportWeaponSettings.gaugeOffsetY;
                    return;
                }

                control.value = currentSupportWeaponSettings[key];

        function parseAutoFireReleaseSecondsInput(value) {
            const text = String(value ?? '').trim();
            if (!/^\d+(?:\.\d+)?$/.test(text)) return null;

            const number = Number(text);
            if (!Number.isFinite(number)) return null;
            return Math.max(0.1, Math.min(5, Number(number.toFixed(2))));

        function revertAutoFireReleaseSecondsInput(control) {

            const parsed = parseAutoFireReleaseSecondsInput(control.value);
            if (parsed === null) {
                // 자동사격 시간 입력이 비었거나 숫자로 해석되지 않으면 마지막으로 저장된 값으로 되돌린다.
                revertAutoFireReleaseSecondsInput(control);
                return;

            currentSupportWeaponSettings = normalizeSupportWeaponSettings(currentSupportWeaponSettings || {});
            currentSupportWeaponSettings.autoFireReleaseSeconds = parsed;
