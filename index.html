            postAppMessage({ type: 'OPEN_AUTO_RELOAD_CALIBRATION' });
        }

        function openPresetOverlay() {
            postAppMessage({ type: 'OPEN_PRESET_OVERLAY' });
        }

        function closeCrosshairEditor() {
            document.getElementById('crosshair-editor-modal').style.display = 'none';
        }

        function updateCrosshairPreview() {
            const preview = document.getElementById('crosshair-preview');
            const dot = preview?.querySelector('.crosshair-preview-dot');
            if (!preview || !dot || !currentCrosshairSettings) return;

            const scale = currentCrosshairSettings.overallSize / 100;
            preview.style.setProperty('--dot-size', `${currentCrosshairSettings.dotSize * scale}px`);
            preview.style.setProperty('--dot-thickness', `${currentCrosshairSettings.dotThickness * scale}px`);
            preview.style.setProperty('--dot-color', currentCrosshairSettings.dotColor);
            preview.style.setProperty('--dot-opacity', String(currentCrosshairSettings.dotOpacity / 100));
            preview.style.setProperty('--line-gap', `${currentCrosshairSettings.crosshairGap * scale}px`);
            preview.style.setProperty('--line-length', `${currentCrosshairSettings.crosshairLength * scale}px`);
            preview.style.setProperty('--line-thickness', `${currentCrosshairSettings.crosshairThickness * scale}px`);
            preview.style.setProperty('--line-color', currentCrosshairSettings.crosshairColor);
            preview.style.setProperty('--line-opacity', String(currentCrosshairSettings.crosshairOpacity / 100));
            preview.style.setProperty('--outline-thickness', `${currentCrosshairSettings.outlineThickness * scale}px`);
            preview.style.setProperty('--outline-color', hexToRgba(currentCrosshairSettings.outlineColor, currentCrosshairSettings.outlineOpacity / 100));

            // 중앙점 형태는 클래스만 바꿔 미리보기와 실제 오버레이의 레이어 개념을 맞춘다.
            dot.classList.toggle('filled', currentCrosshairSettings.dotStyle === 'filled');
            dot.classList.toggle('none', currentCrosshairSettings.dotStyle === 'none');
        }

        function hexToRgba(hex, alpha) {
            const value = String(hex || '#000000').replace('#', '');
            const r = parseInt(value.slice(0, 2), 16) || 0;
            const g = parseInt(value.slice(2, 4), 16) || 0;
            const b = parseInt(value.slice(4, 6), 16) || 0;
            return `rgba(${r},${g},${b},${Math.max(0, Math.min(1, alpha))})`;
        }

        function queueCrosshairSettingsSave() {
            // 슬라이더 입력은 연속으로 들어오므로 짧게 모아서 오버레이와 파일 저장을 갱신한다.
            clearTimeout(pendingCrosshairSettingsTimer);
            pendingCrosshairSettingsTimer = setTimeout(() => {
                postAppMessage({ type: 'SET_CROSSHAIR_SETTINGS', settings: currentCrosshairSettings });
            }, 60);
        }

        document.addEventListener('focusout', (e) => {
            const control = e.target.closest('[data-support-weapon-setting="autoFireReleaseSeconds"]');
            if (control) commitAutoFireReleaseSecondsInput(control);
        });

        document.addEventListener('keydown', (e) => {
            const control = e.target.closest('[data-support-weapon-setting="autoFireReleaseSeconds"]');
            if (!control || e.key !== 'Enter') return;
            e.preventDefault();
            commitAutoFireReleaseSecondsInput(control);
            control.blur();
        });

        document.addEventListener('input', (e) => {
            const supportControl = e.target.closest('[data-support-weapon-setting]');
            if (supportControl) {
                currentSupportWeaponSettings = normalizeSupportWeaponSettings(currentSupportWeaponSettings || {});
                const supportKey = supportControl.dataset.supportWeaponSetting;
                if (supportKey === 'autoFireReleaseSeconds') {
                    const parsed = parseAutoFireReleaseSecondsInput(supportControl.value);
                    if (parsed !== null) {
                        currentSupportWeaponSettings.autoFireReleaseSeconds = parsed;
                        queueSupportWeaponSettingsSave();
                    }
                    return;
                }

                if (supportControl.type === 'checkbox') {
                    currentSupportWeaponSettings[supportKey] = supportControl.checked === true;
                } else if (supportControl.tagName === 'SELECT') {
                    currentSupportWeaponSettings[supportKey] = supportControl.value;
                } else if (supportKey === 'gaugeOffsetX' && currentSupportWeaponSettings.gaugeVerticalMode) {
                    currentSupportWeaponSettings.verticalGaugeOffsetX = Number(supportControl.value);
                } else if (supportKey === 'gaugeOffsetY' && currentSupportWeaponSettings.gaugeVerticalMode) {
                    currentSupportWeaponSettings.verticalGaugeOffsetY = Number(supportControl.value);
                } else {
                    currentSupportWeaponSettings[supportKey] = Number(supportControl.value);
                }
                renderSupportWeaponSettings(currentSupportWeaponSettings);
                queueSupportWeaponSettingsSave();
                return;
            }

            const control = e.target.closest('[data-crosshair-setting]');
            if (!control) return;

            currentCrosshairSettings = normalizeCrosshairSettings(currentCrosshairSettings || {});
            const key = control.dataset.crosshairSetting;
            currentCrosshairSettings[key] = control.type === 'checkbox'
                ? control.checked
                : (control.type === 'color' || control.tagName === 'SELECT' ? control.value : Number(control.value));
            renderCrosshairSettings(currentCrosshairSettings);
            queueCrosshairSettingsSave();
        });

        document.addEventListener('change', (e) => {
            const supportSelect = e.target.closest('select[data-support-weapon-setting]');
            if (!supportSelect) return;

            currentSupportWeaponSettings = normalizeSupportWeaponSettings(currentSupportWeaponSettings || {});
            const supportKey = supportSelect.dataset.supportWeaponSetting;
            currentSupportWeaponSettings[supportKey] = supportSelect.value;
            renderSupportWeaponSettings(currentSupportWeaponSettings);
            queueSupportWeaponSettingsSave();
        });

        initializeCrosshairNumberInputs();
        applySettingsPanelCollapsed();
        applyManualStratagemKeysExpanded();

        function renderSettings(data) {
            currentWaitingKeyTarget = data.waitingTarget || null;
            if (!initialSelectionStateReceived) {
                // 시작 시점의 마지막 탭만 복원 대상으로 사용한다. 이후 설정 메시지는 선택을 되돌리지 않는다.
                pendingSelectedPresetId = typeof data.selectedPresetId === 'string' ? data.selectedPresetId : pendingSelectedPresetId;
                pendingSelectedEquipmentPresetId = typeof data.selectedEquipmentPresetId === 'string'
                    ? data.selectedEquipmentPresetId
                    : pendingSelectedEquipmentPresetId;
                initialSelectionStateReceived = true;
            }

            currentInputDelay = data.inputDelay ?? 30;
            updateInputDelayLabel(currentInputDelay);
            additionalStratagemSlots = Math.max(0, Math.min(maxAdditionalStratagemSlots, Math.trunc(Number(data.additionalStratagemSlots) || 0)));
            const additionalSlotsControl = document.getElementById('setting-additional-stratagem-slots');
            if (additionalSlotsControl) additionalSlotsControl.value = String(additionalStratagemSlots);
            applyStratagemSlotLayout();
            stratagemCompactLayout = data.stratagemCompactLayout === true;
            useLegacyEquipmentLayout = data.useLegacyEquipmentLayout === true;
            stratagemReselectEnabled = data.stratagemReselectEnabled !== false;
            presetAutoSaveEnabled = data.presetAutoSaveEnabled === true;
            testModeEnabled = data.testModeEnabled === true;
            muteGameAudioWhenInactive = data.muteGameAudioWhenInactive === true;
            excludeOverlaysFromCapture = data.excludeOverlaysFromCapture === true;
            const autoReloadEnabled = data.autoReloadEnabled === true;
            const autoReloadCooldownMs = Math.max(100, Math.min(10000, Number(data.autoReloadCooldownMs) || 1000));
            window.autoReloadCooldownMs = autoReloadCooldownMs;
            const stratagemReselectControl = document.getElementById('setting-stratagem-reselect-enabled');
            if (stratagemReselectControl) stratagemReselectControl.checked = stratagemReselectEnabled;
            const presetAutoSaveControl = document.getElementById('setting-preset-auto-save');
            if (presetAutoSaveControl) presetAutoSaveControl.checked = presetAutoSaveEnabled;
            const legacyEquipmentLayoutControl = document.getElementById('setting-legacy-equipment-layout');
            if (legacyEquipmentLayoutControl) legacyEquipmentLayoutControl.checked = useLegacyEquipmentLayout;
            const testModeControl = document.getElementById('setting-test-mode');
            if (testModeControl) testModeControl.checked = testModeEnabled;
            const timerPauses = data.timerPauses || {};
            ['crosshair', 'supportWeapon', 'softwareCursor', 'audioMute', 'gamepad'].forEach(timer => {
                const control = document.getElementById(`timer-test-${timer}`);
                if (control) control.checked = timerPauses[timer] === true;
            });
            const inactiveMuteControl = document.getElementById('setting-inactive-game-audio-mute');
            if (inactiveMuteControl) inactiveMuteControl.checked = muteGameAudioWhenInactive;
            const excludeCaptureControl = document.getElementById('setting-exclude-overlays-from-capture');
            if (excludeCaptureControl) excludeCaptureControl.checked = excludeOverlaysFromCapture;
            const autoReloadControl = document.getElementById('setting-auto-reload');
            if (autoReloadControl) autoReloadControl.checked = autoReloadEnabled;
            const autoReloadCooldownControl = document.getElementById('setting-auto-reload-cooldown');
            if (autoReloadCooldownControl) autoReloadCooldownControl.value = (autoReloadCooldownMs / 1000).toFixed(1);

            const keys = data.keys || {};
            if (String(data.waitingTarget || '').startsWith('manualStratagem')) {
                // 접힌 항목에서 키 입력을 기다리는 경우 현재 대상을 볼 수 있도록 자동으로 펼친다.
                manualStratagemKeysExpanded = true;
                applyManualStratagemKeysExpanded();
            }
            updateSettingKeyButton('autoSelectKey', keys.autoSelectKey, data.waitingTarget);
            updateSettingKeyButton('helperEditorKey', keys.helperEditorKey, data.waitingTarget);
            updateSettingKeyButton('presetOverlayKey', keys.presetOverlayKey, data.waitingTarget);
            updateSettingKeyButton('overlayKey', keys.overlayKey, data.waitingTarget);
            updateSettingKeyButton('reinforceKey', keys.reinforceKey, data.waitingTarget);
            updateSettingKeyButton('stratagemComboKey', keys.stratagemComboKey, data.waitingTarget);
            updateSettingKeyButton('manualStratagemStartKey', keys.manualStratagemStartKey, data.waitingTarget);
            updateSettingKeyButton('manualStratagemUpKey', keys.manualStratagemUpKey, data.waitingTarget);
            updateSettingKeyButton('manualStratagemDownKey', keys.manualStratagemDownKey, data.waitingTarget);
            updateSettingKeyButton('manualStratagemLeftKey', keys.manualStratagemLeftKey, data.waitingTarget);
            updateSettingKeyButton('manualStratagemRightKey', keys.manualStratagemRightKey, data.waitingTarget);
            updateSettingKeyButton('crosshairToggleKey', keys.crosshairToggleKey, data.waitingTarget);
            renderSlotKeySettings(keys.slots || [], data.waitingTarget);
            renderCrosshairSettings(data.crosshair || currentCrosshairSettings || {});
            const globalSupportWeaponSettings = normalizeSupportWeaponSettings(data.supportWeapon || currentSupportWeaponSettings || {});
            // SETTINGS_LOADED는 입력값이 런타임에 적용된 뒤에도 도착한다. 여기서 프리셋의 저장본을
            // 우선하면 자동저장이 꺼진 상태에서 편집 중인 값이 이전 값으로 즉시 되돌아간다.
            // 프리셋 전환 시에는 C#이 현재 런타임 값을 이미 해당 프리셋 값으로 교체하므로,
            // 항상 런타임 설정을 렌더링해야 입력 중인 값과 실제 게이지 동작이 일치한다.
            renderSupportWeaponSettings(globalSupportWeaponSettings);
            applyPendingSelectedPreset();
        }

        function updateSettingKeyButton(target, keyInfo, waitingTarget) {
            const button = document.querySelector(`[data-setting-key="${target}"]`);
            if (!button) return;

            const isWaiting = waitingTarget === target;
            const row = document.querySelector(`[data-setting-row="${target}"]`);
            button.textContent = isWaiting ? '입력 대기 중' : (keyInfo?.name || '없음');
            row?.classList.toggle('waiting', isWaiting);
        }

        function renderSlotKeySettings(slots, waitingTarget) {
            const container = document.getElementById('slot-key-settings');
            if (!container) return;

            container.innerHTML = '';
            for (let slot = 1; slot <= getStratagemSlotCount(); slot++) {
                const target = `slot${slot}`;
                const slotLabel = String(slot).padStart(2, '0');
                const info = slots.find(item => item?.slot === slot);

                const row = document.createElement('div');
                row.className = 'setting-row';
                row.dataset.settingRow = target;

                const label = document.createElement('span');
                label.className = 'setting-label';
                label.textContent = `스트라타젬 #${slotLabel}`;

                const button = document.createElement('button');
                button.className = 'setting-key-btn';
                button.type = 'button';
                button.dataset.settingKey = target;
                button.tabIndex = -1;
                button.textContent = waitingTarget === target ? '입력 대기 중' : (info?.name || '없음');
                row.classList.toggle('waiting', waitingTarget === target);
                row.addEventListener('click', () => startKeyCapture(target));

                row.append(label, button);
                container.appendChild(row);
            }
        }

        renderSettings({ inputDelay: 30, waitingTarget: null, keys: { slots: [] } });

        document.addEventListener('mousedown', (e) => {
            if (!currentWaitingKeyTarget || e.button !== 0) return;
            if (e.target.closest('[data-setting-row]')) return;

            postAppMessage({ type: 'CANCEL_KEY_CAPTURE' });
        }, true);
        document.addEventListener('contextmenu', (e) => {
            const settingRow = e.target.closest('[data-setting-row]');
            if (settingRow?.dataset.settingRow) {
                e.preventDefault();
                // 키 설정 행을 우클릭하면 새 키 입력 대기 대신 해당 단축키를 바로 해제한다.
                postAppMessage({ type: 'CLEAR_KEY_SETTING', target: settingRow.dataset.settingRow });
                return;
            }

            if (!currentWaitingKeyTarget) return;
            e.preventDefault();
        }, true);

        if (window.chrome?.webview) {
            window.chrome.webview.addEventListener('message', (event) => {
                const data = event.data;
                if (!data) return;

                if (data.type === 'DISABLED_ITEMS_LOADED' && Array.isArray(data.items)) {
                    excludedItems.clear();
                    data.items.forEach(name => {
                        if (typeof name === 'string' && name.trim()) excludedItems.add(name.trim());
                    });

                    if (currentTargetSlot) refreshCurrentModal();
                } else if (data.type === 'PRESETS_LOADED' && data.presets) {
                    const collections = normalizePresetCollections(data.presets);
                    presets = collections.stratagemPresets;
                    equipmentPresets = collections.equipmentPresets;
                    presetsLoaded = true;
                    equipmentPresetsLoaded = true;
                    if (!initialPresetSelectionStateReceived) {
                        pendingSelectedPresetId = typeof data.selectedPresetId === 'string'
                            ? data.selectedPresetId
                            : pendingSelectedPresetId;
                        pendingSelectedEquipmentPresetId = typeof data.selectedEquipmentPresetId === 'string'
                            ? data.selectedEquipmentPresetId
                            : pendingSelectedEquipmentPresetId;
                        initialPresetSelectionStateReceived = true;
                    }
                    applyPendingSelectedPreset();
                    renderPresetTabs();
                    renderEquipmentPresetTabs();
                } else if (data.type === 'SELECT_PRESET_FROM_APP' && typeof data.id === 'string') {
                    selectPresetFromApp(data.id);
                } else if (data.type === 'SELECT_EQUIPMENT_PRESET_FROM_APP' && typeof data.id === 'string') {
                    selectEquipmentPresetFromApp(data.id);
                } else if (data.type === 'CURRENT_LOADOUT_SYNC' && data.loadout) {
                    // 원본 창과 F3 편집창은 저장 여부와 무관하게 현재 편집 중인 로드아웃을 같은 모습으로 유지한다.
                    // 프로그램 시작 직후의 빈 런타임 상태는 마지막 프리셋 복원을 막지 않는다.
                    currentLoadoutSyncReceived = data.loadout.hasRuntimeLoadout === true;
                    applyCurrentLoadoutFromApp(data.loadout);
                } else if (data.type === 'SETTINGS_LOADED') {
                    renderSettings(data);
                }
            });

            postAppMessage({ type: 'LOAD_DISABLED_ITEMS' });
            postAppMessage({ type: 'LOAD_PRESETS' });
            postAppMessage({ type: 'LOAD_SETTINGS' });
        }

        window.addEventListener('keydown', function (e) {
            if ((e.ctrlKey || e.metaKey) && e.key?.toLowerCase() === 's') {
                e.preventDefault();
                e.stopPropagation();
                // Ctrl+S는 브라우저 저장 대신 현재 선택된 프리셋 저장으로 사용한다.
                window.hd2SaveCurrentPresetFromHook?.();
                return false;
            }
            if ((e.ctrlKey || e.metaKey) && e.key?.toLowerCase() === 'z') {
                e.preventDefault();
                e.stopPropagation();
                window.hd2UndoPresetEdit?.();
                return false;
            }
            if ((e.ctrlKey || e.metaKey) && e.key?.toLowerCase() === 'r') {
                e.preventDefault();
                e.stopPropagation();
                window.hd2RedoPresetEdit?.();
                return false;
            }
            if (
                e.key === 'Tab' &&
                document.activeElement?.matches('input')
            ) {
                e.preventDefault();
                return false;
            }

            if (
                (e.key === 'Enter' || e.code === 'Space') &&
                document.activeElement?.matches('button')
            ) {
                e.preventDefault();
                return false;
            }

        }, true);

        const slotsContainer = document.getElementById('slots-container');

        function setImageFallback(img, width = 100, height = 100) {
            img.onerror = null;
            const size = Math.min(width, height);
            const cx = width / 2;
            const cy = height / 2;
            const frameW = size * 0.42;
            const frameH = size * 0.32;
            const frameX = cx - frameW / 2;
            const frameY = cy - frameH / 2;
            const slash = size * 0.24;
            const stroke = Math.max(2, size * 0.035);
            const svg = `
                                        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
                                            <g opacity="0.5" fill="none" stroke="#777777" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">
                                                <rect x="${frameX}" y="${frameY}" width="${frameW}" height="${frameH}" rx="${stroke}"/>
                                                <circle cx="${frameX + frameW * 0.28}" cy="${frameY + frameH * 0.32}" r="${size * 0.035}" fill="#777777" stroke="none"/>
                                                <path d="M${frameX + frameW * 0.18} ${frameY + frameH * 0.78} L${frameX + frameW * 0.4} ${frameY + frameH * 0.56} L${frameX + frameW * 0.55} ${frameY + frameH * 0.68} L${frameX + frameW * 0.78} ${frameY + frameH * 0.45}"/>
                                                <path d="M${cx - slash} ${cy + slash} L${cx + slash} ${cy - slash}" opacity="0.9"/>
                                            </g>
                                        </svg>
                                    `;
            img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        function getDefaultOverlaySlotVisibility() {
            // 기본 휠 구성은 첫 줄(1~5)만 표시하고, 기본 6~10번과 추가 보관 슬롯은 모두 숨긴다.
            return Array.from({ length: getStratagemSlotCount() }, (_, index) => index < 5);
        }

        function normalizeOverlaySlotVisibility(source) {
            const defaults = getDefaultOverlaySlotVisibility();
            if (!Array.isArray(source)) return defaults;

            return defaults.map((defaultValue, index) => typeof source[index] === 'boolean' ? source[index] : defaultValue);
        }

        function renderStratagemOverlayState(slot, overlayVisible) {
            const hasPresetState = typeof overlayVisible === 'boolean';
            slot.classList.toggle('overlay-visible', hasPresetState && overlayVisible);
            slot.classList.toggle('overlay-hidden', hasPresetState && !overlayVisible);
            if (hasPresetState) slot.dataset.overlayVisible = overlayVisible ? 'true' : 'false';
            else delete slot.dataset.overlayVisible;
        }

        function getSelectedPresetOverlayVisibility() {
            const preset = presets.find(item => item.id === selectedPresetId);
            return preset ? normalizeOverlaySlotVisibility(preset.overlaySlots) : null;
        }

        function renderStratagemSlot(slot, index, itemName = '', imgUrl = '', overlayVisible = undefined) {
            if (!slot) return;
            slot.dataset.itemName = itemName;
            if (itemName) slot.title = itemName;
            else slot.removeAttribute('title');

            const slotLabel = String(index).padStart(2, '0');
            let label = slot.querySelector('.slot-label');
            if (!label) {
                label = document.createElement('span');
                label.className = 'slot-label';
                slot.prepend(label);
            }
            label.textContent = `#${slotLabel}`;

            let image = slot.querySelector(':scope > img');
            let plus = slot.querySelector('.plus-icon');

            if (imgUrl) {
                if (!image) {
                    image = document.createElement('img');
                    image.onerror = () => setImageFallback(image, 200, 200);
                    slot.appendChild(image);
                }
                if (image.getAttribute('src') !== imgUrl) image.src = imgUrl;
                plus?.remove();
            } else {
                image?.remove();
                if (!plus) {
                    plus = document.createElement('span');
                    plus.className = 'plus-icon';
                    plus.textContent = '＋';
                    slot.appendChild(plus);
                }
            }

            const existingState = slot.dataset.overlayVisible;
            const resolvedOverlayVisible = overlayVisible === null
                ? null
                : typeof overlayVisible === 'boolean'
                    ? overlayVisible
                    : existingState === 'true' ? true : existingState === 'false' ? false : null;
            renderStratagemOverlayState(slot, resolvedOverlayVisible);
        }

        function getStratagemItemByName(name) {
            if (!dbData || !dbData['스트라타젬'] || !name) return null;
            for (const group of Object.values(dbData['스트라타젬'])) {
                const found = group.find(item => item.Name === name);
                if (found) return found;
            }
            return null;
        }

        function isExosuitStratagem(itemOrName) {
            const item = typeof itemOrName === 'string' ? getStratagemItemByName(itemOrName) : itemOrName;
            return !!item && typeof item.Desc === 'string' && item.Desc.includes('엑소슈트');
        }

        function isBackpackStratagem(itemOrName) {
            const item = typeof itemOrName === 'string' ? getStratagemItemByName(itemOrName) : itemOrName;
            return !!item && typeof item.Desc === 'string' && item.Desc.includes('배낭');
        }

        function hasSameExosuitEquippedExcept(slotIndex, candidateName) {
            // 엑소슈트는 보관 슬롯을 포함해 같은 종류를 두 개 장착하지 못하도록 한다.
            return Array.from(slotsContainer.querySelectorAll('.slot')).some((slot, index) =>
                index + 1 !== slotIndex && slot.dataset.itemName === candidateName);
        }

        function canSwapStratagemSlots(draggedIndex, draggedName, targetIndex, targetName) {
            // 드래그 뒤에도 동일한 엑소슈트가 두 슬롯에 남지 않도록 전체 슬롯을 검사한다.
            const exosuitNames = new Set();
            for (let index = 1; index <= getStratagemSlotCount(); index++) {
                let name = document.getElementById(`slot-${index}`)?.dataset.itemName || '';
                if (index === draggedIndex) name = targetName;
                else if (index === targetIndex) name = draggedName;
                if (!isExosuitStratagem(name)) continue;
                if (exosuitNames.has(name)) return false;
                exosuitNames.add(name);
            }
            return true;
        }

        function getRandomItem(pool) {
            if (!pool || pool.length === 0) return null;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function getItemImageUrl(type, name) {
            const folders = {
                '스트라타젬': 'stratagems',
                '방어구': 'armors',
                '주 무기': 'weapons',
                '보조 무기': 'weapons',
                '투척 무기': 'weapons'
            };
            // 무기명에 포함된 /는 URL 경로로 해석되므로 파일명에서는 안전한 밑줄로 바꾼다.
            const imageName = String(name || '').replaceAll('/', '_');
            return `https://hd2.local/images/${folders[type]}/${imageName}.png`;
        }

        function normalizeSearchText(value) {
            return (value || '').toLowerCase().replace(/\s+/g, '');
        }

        function getWeaponTraitSearchText(description = '') {
            return String(description)
                .split(/\r?\n/)
                .slice(1)
                .join(' / ');
        }

        const customSearchAliases = [
            {
                types: ['주 무기', '보조 무기', '투척 무기'],
                terms: ['일반 장갑 관통'],
                aliases: ['일장갑']
            }
        ];

        function addCustomSearchAliases(type, searchParts) {
            const normalizedSource = normalizeSearchText(searchParts.join(' '));

            customSearchAliases.forEach(rule => {
                if (rule.types && !rule.types.includes(type)) return;

                const hasMatch = rule.terms.some(term => normalizedSource.includes(normalizeSearchText(term)));
                if (hasMatch) searchParts.push(...rule.aliases);
            });
        }

        function getDatabaseAliases(item) {
            if (!item) return [];
            if (Array.isArray(item.Aliases)) return item.Aliases.filter(Boolean);
            if (typeof item.Aliases === 'string' && item.Aliases.trim()) return [item.Aliases.trim()];
            return [];
        }

        function getItemSearchText(type, item) {
            const searchParts = [item?.Name || ''];
            searchParts.push(...getDatabaseAliases(item));

            if (type === '방어구' && item?.Passives) {
                searchParts.push(item.Passives);
                searchParts.push(...getDatabaseAliases(getPassiveItem(item.Passives.trim())));
            } else if (['주 무기', '보조 무기', '투척 무기'].includes(type)) {
                searchParts.push(getWeaponTraitSearchText(item?.Desc));
            }

            addCustomSearchAliases(type, searchParts);
            return normalizeSearchText(searchParts.join(' '));
        }

        function updateModalSearchPlaceholder(type) {
            const searchInput = document.getElementById('modal-search');
            if (!searchInput) return;

            if (type === '방어구') {
                searchInput.placeholder = '이름, 패시브로 검색';
            } else if (['주 무기', '보조 무기', '투척 무기'].includes(type)) {
                searchInput.placeholder = '이름, 특성으로 검색';
            } else {
                searchInput.placeholder = '이름으로 검색';
            }
        }

        function getLoadoutTargetId(type) {
            if (type === '방어구') return 'selected-armor';
            if (type === '주 무기') return 'selected-primary';
            if (type === '보조 무기') return 'selected-secondary';
            if (type === '투척 무기') return 'selected-grenade';
            return '';
        }

        function renderLoadoutBox(type, name, imgUrl = '') {
            const targetId = getLoadoutTargetId(type);
            if (!targetId) return;

            const box = document.getElementById(targetId);
            if (!box) return;

            if (!name) {
                box.dataset.itemName = '';
                box.removeAttribute('title');
                box.closest('.loadout-box')?.removeAttribute('title');
                box.querySelector(':scope > img')?.remove();
                let plus = box.querySelector('.empty-plus');
                if (!plus) {
                    plus = document.createElement('span');
                    plus.className = 'empty-plus';
                    plus.textContent = '＋';
                    box.appendChild(plus);
                }
                return;
            }

            let fallbackW = 640;
            let fallbackH = 360;
            if (type === '방어구' || type === '투척 무기') {
                fallbackW = 480;
                fallbackH = 480;
            }

            box.dataset.itemName = name;
            box.title = name;
            box.closest('.loadout-box')?.setAttribute('title', name);
            const displayUrl = imgUrl || getCachedDisplayImageUrl(type, name);
            let image = box.querySelector(':scope > img');
            if (!image) {
                image = document.createElement('img');
                image.onerror = () => setImageFallback(image, fallbackW, fallbackH);
                box.appendChild(image);
            }

            if (displayUrl && image.getAttribute('src') !== displayUrl) image.src = displayUrl;
            if (!displayUrl) setImageFallback(image, fallbackW, fallbackH);
            box.querySelector('.empty-plus')?.remove();
        }

        function isHiddenDatabaseCategory(type, category) {
            return type === '방어구' && category === '패시브';
        }

        function getPassiveItem(name) {
            if (!dbData || !name) return null;

            const passiveItems = dbData['방어구']?.['패시브'];
            if (!Array.isArray(passiveItems)) return null;

            return passiveItems.find(item => item.Name === name) ?? null;
        }

        function getArmorRating(item) {
            const match = String(item?.Desc || '').match(/장갑 등급\s*(\d+)/);
            return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
        }

        function getArmorPassiveNames(item) {
            return String(item?.Passives || '')
                .split(',')
                .map(name => name.trim())
                .filter(Boolean);
        }

        function compareArmorItems(left, right) {
            if (armorSortMode === 'passive') {
                const passiveCompare = String(left.Passives || '').localeCompare(String(right.Passives || ''), 'ko');
                if (passiveCompare !== 0) return passiveCompare;
            } else {
                // 장갑 등급 모드는 경량·일반·중량 구역 안의 database.json 등록 순서를 그대로 사용한다.
                return 0;
            }
            return String(left.Name || '').localeCompare(String(right.Name || ''), 'ko');
        }

        function getArmorModalGroups() {
            // 정렬은 각 장갑 등급 구역 안에서만 적용해 경량·일반·중량 분류가 섞이지 않게 유지한다.
            return ['경량', '일반', '중량']
                .map(category => {
                    const sourceItems = (dbData?.['방어구']?.[category] || [])
                        .filter(item => item?.Passives && !excludedItems.has(item.Name))
                        .filter(item => !armorPassiveFilter || getArmorPassiveNames(item).includes(armorPassiveFilter))
                    // 패시브 모드에서만 이름순 정렬하고, 장갑 등급 모드에서는 데이터 순서를 보존한다.
                    const items = armorSortMode === 'passive'
                        ? sourceItems.slice().sort(compareArmorItems)
                        : sourceItems;
                    return [category, items];
                })
                .filter(([, items]) => items.length > 0);
        }

        function getArmorTooltipDescription(item, armorDescription) {
            const passiveDetails = getArmorPassiveNames(item)
                .map(passiveName => {
                    const passive = getPassiveItem(passiveName);
                    return `${passiveName}\n${passive?.Desc || '상세 효과 데이터가 없습니다.'}`;
                })
                .join('\n\n');
            return [armorDescription, passiveDetails].filter(Boolean).join('\n\n');
        }

        function getArmorGridPassiveHtml(item) {
            return getArmorPassiveNames(item)
                .map(passiveName => `
                    <div class="armor-grid-passive">
                        <img src="https://hd2.local/images/passives/${passiveName}.png" onerror="setImageFallback(this, 48, 48)" />
                        <span>${passiveName}</span>
                    </div>
                `)
                .join('');
        }

        function getEquipmentGridLayoutClass(type) {
            if (useLegacyEquipmentLayout) return 'item-list-layout';
            if (type === '방어구') return 'item-grid-layout equipment-grid-layout equipment-grid-armor';
            if (type === '주 무기') return 'item-grid-layout equipment-grid-layout equipment-grid-primary';
            if (type === '보조 무기') return 'item-grid-layout equipment-grid-layout equipment-grid-secondary';
            if (type === '투척 무기') return 'item-grid-layout equipment-grid-layout equipment-grid-grenade';
            return 'item-list-layout';
        }

        function positionItemHoverTooltip(event) {
            const tooltip = document.getElementById('item-hover-tooltip');
            if (!tooltip || tooltip.style.display !== 'block') return;

            // 포인터를 가리지 않도록 툴팁 시작점을 우측 하단으로 충분히 떨어뜨리고, 화면 끝에서는 안쪽으로 보정한다.
            const edgeMargin = 12;
            const offsetX = 24;
            const offsetY = 42;
            const maxLeft = window.innerWidth - tooltip.offsetWidth - edgeMargin;
            const maxTop = window.innerHeight - tooltip.offsetHeight - edgeMargin;
            tooltip.style.left = `${Math.max(edgeMargin, Math.min(event.clientX + offsetX, maxLeft))}px`;
            tooltip.style.top = `${Math.max(edgeMargin, Math.min(event.clientY + offsetY, maxTop))}px`;
        }

        function hideItemHoverTooltip() {
            const tooltip = document.getElementById('item-hover-tooltip');
            if (tooltip) tooltip.style.display = 'none';
        }

        function attachItemHoverTooltip(element, title, description) {
            if (!element) return;

            // 자체 툴팁은 마우스 위치와 겹치지 않도록 제어할 수 있고, 선택창보다 위 레이어에서 설명을 표시한다.
            element.removeAttribute('title');
            element.addEventListener('mouseenter', event => {
                const tooltip = document.getElementById('item-hover-tooltip');
                document.getElementById('item-hover-tooltip-title').textContent = title;
                document.getElementById('item-hover-tooltip-body').textContent = description || '상세 정보가 없습니다.';
                tooltip.style.display = 'block';
                positionItemHoverTooltip(event);
            });
            element.addEventListener('mousemove', positionItemHoverTooltip);
            element.addEventListener('mouseleave', hideItemHoverTooltip);
            element.addEventListener('click', hideItemHoverTooltip);
        }

        function renderArmorControls() {
            const controls = document.getElementById('armor-modal-controls');
            const ratingButton = document.getElementById('armor-sort-rating');
            const passiveButton = document.getElementById('armor-sort-passive');
            const dropdown = document.getElementById('armor-passive-dropdown');
            if (!controls || !ratingButton || !passiveButton || !dropdown) return;

            controls.style.display = 'block';
            ratingButton.classList.toggle('active', armorSortMode === 'rating');
            passiveButton.classList.toggle('active', armorSortMode === 'passive');
            dropdown.innerHTML = '';

            const allButton = document.createElement('button');
            allButton.type = 'button';
            allButton.className = `armor-passive-option ${armorPassiveFilter ? '' : 'selected'}`;
            allButton.textContent = '전체 패시브';
            allButton.tabIndex = -1;
            allButton.addEventListener('click', () => setArmorPassiveFilter(''));
            dropdown.appendChild(allButton);

            const passives = (dbData?.['방어구']?.['패시브'] || [])
                .slice()
                .sort((left, right) => String(left.Name || '').localeCompare(String(right.Name || ''), 'ko'));
            passives.forEach(passive => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `armor-passive-option ${armorPassiveFilter === passive.Name ? 'selected' : ''}`;
                button.tabIndex = -1;

                const icon = document.createElement('img');
                icon.src = `https://hd2.local/images/passives/${passive.Name}.png`;
                icon.alt = '';
                icon.onerror = () => setImageFallback(icon, 48, 48);
                const label = document.createElement('span');
                label.textContent = passive.Name;
                button.append(icon, label);
                attachItemHoverTooltip(button, passive.Name, passive.Desc || '상세 효과 데이터가 없습니다.');
                button.addEventListener('click', () => setArmorPassiveFilter(passive.Name));
                dropdown.appendChild(button);
            });
        }

        function setArmorSortMode(mode) {
            const dropdown = document.getElementById('armor-passive-dropdown');
            if (mode === 'passive' && armorSortMode === 'passive') {
                dropdown?.classList.toggle('open');
                return;
            }

            armorSortMode = mode;
            dropdown?.classList.remove('open');
            openModal('방어구', null, { preserveScroll: true, preserveArmorState: true });
        }

        function setArmorPassiveFilter(passiveName) {
            armorPassiveFilter = passiveName;
            armorSortMode = 'passive';
            hideItemHoverTooltip();
            openModal('방어구', null, { preserveScroll: true, preserveArmorState: true });
        }

        function flattenDatabaseType(type) {
            if (!dbData || !dbData[type]) return [];
            return Object.entries(dbData[type]).flatMap(([category, items]) => {
                if (isHiddenDatabaseCategory(type, category)) return [];
                if (!Array.isArray(items)) return [];
                return items.map(item => ({ ...item, Type: type, Category: category }));
            });
        }

        function updateExcludedCardStates() {
            document.querySelectorAll('#modal-dynamic-content .mini-card').forEach(card => {
                const itemName = card.dataset.rawName;
                if (!itemName) return;
                if (card.closest('#excluded-items-category')) {
                    card.classList.remove('excluded', 'disabled', 'selected-current');
                    return;
                }
                const isExcluded = excludedItems.has(itemName);
                card.classList.toggle('disabled', isExcluded || card.dataset.ruleDisabled === 'true');
            });
        }

        function renderExcludedItemsCategory() {
            const container = document.getElementById('modal-dynamic-content');
            if (!container) return;

            document.getElementById('excluded-items-category')?.remove();
            const targetType = currentTargetSlot?.type;
            const excludedInCurrentType = flattenDatabaseType(targetType)
                .filter(item => excludedItems.has(item.Name))
                // 패시브 필터를 고른 경우 제외 목록도 같은 조건으로 제한해 관련 없는 갑옷을 노출하지 않는다.
                .filter(item => targetType !== '방어구'
                    || !armorPassiveFilter
                    || getArmorPassiveNames(item).includes(armorPassiveFilter));

            if (excludedInCurrentType.length === 0) return;

            const groupWrap = document.createElement('div');
            groupWrap.id = 'excluded-items-category';
            groupWrap.className = 'category-group';
            groupWrap.innerHTML = `<div class="category-title">제외</div>`;

            const listLayout = document.createElement('div');
            listLayout.className = targetType === '스트라타젬' ? getStratagemGridLayoutClass() : 'item-list-layout';

            excludedInCurrentType.forEach(item => {
                const name = item.Name;
                const type = item.Type;
                const ratioClass = (type === '방어구') ? 'img-ratio-armor' : (type === '투척 무기') ? 'img-ratio-grenade' : 'img-ratio-weapon';
                const svgW = (type === '방어구' || type === '투척 무기') ? 480 : 640;
                const svgH = (type === '방어구' || type === '투척 무기') ? 480 : 360;
                const description = item.Desc || "상세 정보가 없습니다.";
                let passiveHtml = '';

                if (type === '방어구' && item.Passives) {
                    const pName = item.Passives.trim();
                    const pData = getPassiveItem(pName);
                    const pDesc = pData ? pData.Desc : "상세 효과 데이터가 없습니다.";
                    const pIconUrl = `https://hd2.local/images/passives/${pName}.png`;

                    passiveHtml = `
                                                                <div class="passive-container">
                                                                    <img class="passive-icon" src="${pIconUrl}" onerror="setImageFallback(this, 48, 48)">
                                                                    <div class="passive-info">
                                                                        <div class="passive-name">${pName}</div>
                                                                        <div class="passive-desc">${pDesc}</div>
                                                                    </div>
                                                                </div>
                                                            `;
                }

                const card = document.createElement('div');
                card.className = 'mini-card';
                card.setAttribute('data-name', getItemSearchText(type, item));
                card.setAttribute('data-raw-name', name);
                card.setAttribute('data-rule-disabled', 'false');
                card.setAttribute('tabindex', '-1');

                if (targetType === '스트라타젬') {
                    if (stratagemCompactLayout) card.title = name;
                    else card.removeAttribute('title');
                    card.innerHTML = getStratagemCardHtml(name, getItemImageUrl(type, name));
                } else {
                    const displayUrl = getCachedDisplayImageUrl(type, name);
                    card.innerHTML = `
                                                                <img class="${ratioClass}" src="${displayUrl}" onerror="setImageFallback(this, ${svgW}, ${svgH})" />
                                                                <div class="info-area">
                                                                    <div class="name">${name}</div>
                                                                    <div class="desc">${description}</div>
                                                                    ${passiveHtml}
                                                                </div>
                                                            `;
                    if (!displayUrl) setImageFallback(card.querySelector('img'), svgW, svgH);
                }

                card.addEventListener('contextmenu', (e) => toggleExcludedItem(e, name, type));
                listLayout.appendChild(card);
            });

            groupWrap.appendChild(listLayout);
            container.appendChild(groupWrap);
        }

        function getExcludedItemLabel(type) {
            if (type === '스트라타젬') return { subject: '스트라타젬이', topic: '스트라타젬은' };
            if (type === '방어구') return { subject: '방어구가', topic: '방어구는' };
            return { subject: '무기가', topic: '무기는' };
        }

        function toggleExcludedItem(e, name, type = currentTargetSlot?.type) {
            e.preventDefault();
            e.stopPropagation();

            const isExcluded = excludedItems.has(name);
            const itemLabel = getExcludedItemLabel(type);
            openConfirmModal(
                `${name} ${isExcluded ? '제외 해제' : '제외'}`,
                isExcluded
                    ? `해제하면 목록과 자동 선택에 다시 포함됩니다.\n정말 보유 중인 ${itemLabel.subject} 맞습니까?`
                    : `제외된 ${itemLabel.topic} 목록 하단에서 해제할 수 있습니다.\n정말 보유하지 않은 ${itemLabel.subject} 맞습니까?`,
                isExcluded ? '해제' : '제외',
                async () => {
                    if (isExcluded) {
                        excludedItems.delete(name);
                    } else {
                        excludedItems.add(name);
                        clearEquippedItem(name);
                    }
                    saveDisabledItems();
                    await refreshCurrentModal();
                }
            );
        }

        async function refreshCurrentModal() {
            if (!currentTargetSlot) return;

            const searchInput = document.getElementById('modal-search');
            const modalBody = document.getElementById('modal-item-list');
            const query = searchInput.value;
            const scrollTop = modalBody.scrollTop;
            const targetType = currentTargetSlot.type;
            const targetIndex = currentTargetSlot.index ?? null;

            await openModal(targetType, targetIndex, { preserveScroll: true });

            filterModalItems();

        function setModalTitle(text, actionText = '') {
            const title = document.getElementById('modal-title');
            title.textContent = text;
            if (!actionText) return;

            const action = document.createElement('button');
            action.className = 'modal-title-action';
            action.type = 'button';

        function getStratagemCardHtml(name, imageUrl) {
            return stratagemCompactLayout
                ? `<img src="${imageUrl}" onerror="setImageFallback(this, 60, 60)" />`

                                                                <img src="${imageUrl}" onerror="setImageFallback(this, 60, 60)" />

                                                            `;
        }

        async function toggleStratagemModalLayout() {
            stratagemCompactLayout = !stratagemCompactLayout;
            postAppMessage({ type: 'SET_STRATAGEM_LAYOUT', compact: stratagemCompactLayout });
            await refreshCurrentModal();
            document.getElementById('modal-item-list').scrollTop = 0;
