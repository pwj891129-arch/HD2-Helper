        function createStratagemSlot(index) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.id = `slot-${index}`;
            slot.setAttribute('draggable', 'true');
            slot.setAttribute('tabindex', '-1');
            renderStratagemSlot(slot, index);

            slot.addEventListener('click', (event) => handleStratagemSlotClick(event, index));
            slot.addEventListener('contextmenu', (e) => clearStratagemSlot(e, index));

            slot.addEventListener('dragstart', handleDragStart);
            slot.addEventListener('dragend', handleDragEnd);
            slot.addEventListener('dragover', handleDragOver);
            slot.addEventListener('drop', handleDrop);

            return slot;
        }

        function applyStratagemSlotLayout() {
            const container = document.getElementById('slots-container');
            if (!container) return;

            const slotCount = getStratagemSlotCount();
            const slotRows = getStratagemSlotRowCount();
            const extraRows = Math.max(0, slotRows - 2);
            // CSS 작업 영역과 WinForms 기준 높이는 같은 130px 행 단위를 사용해 슬롯과 창이 함께 늘어난다.
            document.documentElement.style.setProperty('--stratagem-slot-rows', String(slotRows));
            document.documentElement.style.setProperty('--slots-height', `${250 + (extraRows * stratagemSlotRowHeight)}px`);
            document.documentElement.style.setProperty('--design-height', `${590 + (extraRows * stratagemSlotRowHeight)}px`);
            document.documentElement.style.setProperty('--stage-height', `${630 + (extraRows * stratagemSlotRowHeight)}px`);

            while (container.children.length > slotCount)
                container.lastElementChild?.remove();

            const fragment = document.createDocumentFragment();
            for (let index = container.children.length + 1; index <= slotCount; index++)
                fragment.appendChild(createStratagemSlot(index));
            container.appendChild(fragment);
        }

        applyStratagemSlotLayout();

        function handleDragStart(e) {
            if (!this.dataset.itemName) {
                e.preventDefault();
                return false;
            }
            draggedSlot = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';

            const ghost = document.createElement('div');
            ghost.style.width = '1px';
            ghost.style.height = '1px';
            document.body.appendChild(ghost);
            e.dataTransfer.setDragImage(ghost, 0, 0);
            setTimeout(() => ghost.remove(), 0);
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            draggedSlot = null;
            stopModalSlotDragAutoScroll();
        }

        function handleDragOver(e) {
            e.preventDefault();
            if (e.dataTransfer) {
                e.dataTransfer.dropEffect = draggedSlot && draggedSlot !== this ? 'move' : 'none';
            }
            return false;
        }

        function handleDocumentModalSlotDragOver(e) {
            if (!draggedSlot || currentTargetSlot?.type !== '스트라타젬') return;

            const selector = document.getElementById('modal-slot-selector');
            if (!selector || selector.style.display === 'none') return;

            const rect = selector.getBoundingClientRect();
            const inside = e.clientX >= rect.left && e.clientX <= rect.right
                && e.clientY >= rect.top && e.clientY <= rect.bottom;

            if (inside) {
                startModalSlotDragAutoScroll(e.clientX);
            }
        }

        function startModalSlotDragAutoScroll(pointerX) {
            modalSlotDragPointerX = pointerX;

            if (!modalSlotDragAutoScrollFrame) {
                modalSlotDragLastScrollTime = performance.now();
                modalSlotDragAutoScrollFrame = requestAnimationFrame(runModalSlotDragAutoScroll);
            }
        }

        function runModalSlotDragAutoScroll(timestamp) {
            const selector = document.getElementById('modal-slot-selector');
            if (!draggedSlot || !selector || selector.style.display === 'none') {
                stopModalSlotDragAutoScroll();
                return;
            }

            const rect = selector.getBoundingClientRect();
            const maxScrollLeft = selector.scrollWidth - selector.clientWidth;
            if (maxScrollLeft <= 0) {
                modalSlotDragLastScrollTime = timestamp;
                modalSlotDragAutoScrollFrame = requestAnimationFrame(runModalSlotDragAutoScroll);
                return;
            }

            const edgeSize = Math.min(96, Math.max(64, rect.width * 0.14));
            const minSpeed = 70;
            const maxSpeed = 720;
            let direction = 0;
            let strength = 0;

            if (modalSlotDragPointerX < rect.left + edgeSize && selector.scrollLeft > 0) {
                direction = -1;
                strength = (rect.left + edgeSize - modalSlotDragPointerX) / edgeSize;
            } else if (modalSlotDragPointerX > rect.right - edgeSize && selector.scrollLeft < maxScrollLeft) {
                direction = 1;
                strength = (modalSlotDragPointerX - (rect.right - edgeSize)) / edgeSize;
            }

            strength = Math.max(0, Math.min(1, strength));

            if (direction && strength) {
                const dt = modalSlotDragLastScrollTime ? Math.min(40, timestamp - modalSlotDragLastScrollTime) : 16;
                const easedStrength = strength * strength * (3 - 2 * strength);
                const speed = minSpeed + (maxSpeed - minSpeed) * easedStrength;
                selector.scrollLeft = Math.max(0, Math.min(maxScrollLeft, selector.scrollLeft + direction * speed * (dt / 1000)));
            }

            modalSlotDragLastScrollTime = timestamp;
            modalSlotDragAutoScrollFrame = requestAnimationFrame(runModalSlotDragAutoScroll);
        }

        function stopModalSlotDragAutoScroll() {
            if (modalSlotDragAutoScrollFrame) cancelAnimationFrame(modalSlotDragAutoScrollFrame);
            modalSlotDragAutoScrollFrame = 0;
            modalSlotDragLastScrollTime = 0;
        }

        function getStratagemSlotIndex(element) {
            return Number(element.dataset.slotIndex || element.id?.replace('slot-', ''));
        }

        function isItemModalOpen() {
            return document.getElementById('item-modal')?.style.display === 'flex';
        }

        async function handleDrop(e) {
            e.preventDefault();
            e.stopPropagation();
            if (draggedSlot && draggedSlot !== this) {
                const draggedIndex = getStratagemSlotIndex(draggedSlot);
                const targetIndex = getStratagemSlotIndex(this);
                if (!draggedIndex || !targetIndex) return false;

                const draggedRealSlot = document.getElementById(`slot-${draggedIndex}`);
                const targetRealSlot = document.getElementById(`slot-${targetIndex}`);
                const draggedName = draggedRealSlot?.dataset.itemName || '';
                const draggedImg = draggedRealSlot?.querySelector('img')?.getAttribute('src') || '';
                const targetName = targetRealSlot?.dataset.itemName || '';
                const targetImg = targetRealSlot?.querySelector('img')?.getAttribute('src') || '';

                if (!canSwapStratagemSlots(draggedIndex, draggedName, targetIndex, targetName)) return false;

                // 드래그 교체는 현재 선택된 프리셋 조합 안에서만 한 단계로 취소한다.
                recordPresetEditBeforeChange();
                renderStratagemSlot(targetRealSlot, targetIndex, draggedName, draggedImg);
                renderStratagemSlot(draggedRealSlot, draggedIndex, targetName, targetImg);
                syncCurrentLoadoutToApp();
                if (isItemModalOpen() && currentTargetSlot?.type === '스트라타젬') {
                    await refreshCurrentModal();
                }
            }
            return false;
        }

        async function clearStratagemSlot(e, index) {
            e.preventDefault();
            e.stopPropagation();
            const slot = document.getElementById(`slot-${index}`);
            if (!slot?.dataset.itemName) return;
            // 실제로 채워진 스트라타젬을 비울 때만 실행 취소 기록을 남긴다.
            recordPresetEditBeforeChange();
            renderStratagemSlot(slot, index);
            syncCurrentLoadoutToApp();
            if (isItemModalOpen() && currentTargetSlot?.type === '스트라타젬') {
                await refreshCurrentModal();
            }
        }

        function clearLoadoutBox(e, targetId) {
            e.preventDefault();
            e.stopPropagation();
            if (!document.getElementById(targetId)?.dataset.itemName) return;
            // 장비를 비우는 동작도 같은 프리셋 조합의 기록으로 보관한다.
            recordPresetEditBeforeChange();
            clearLoadoutBoxById(targetId);
            syncCurrentLoadoutToApp();
        }

        function clearLoadoutBoxById(targetId) {
            const box = document.getElementById(targetId);
            if (!box) return;
            const typeByTarget = {
                'selected-armor': '방어구',
                'selected-primary': '주 무기',
                'selected-secondary': '보조 무기',
                'selected-grenade': '투척 무기'
            };
            renderLoadoutBox(typeByTarget[targetId] || '', '');
        }

        function clearEquippedItem(name) {
            for (let i = 1; i <= getStratagemSlotCount(); i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (slot?.dataset.itemName === name) renderStratagemSlot(slot, i);
            }

            ['selected-armor', 'selected-primary', 'selected-secondary', 'selected-grenade'].forEach(targetId => {
                const box = document.getElementById(targetId);
                if (box?.dataset.itemName === name) clearLoadoutBoxById(targetId);
            });
            syncCurrentLoadoutToApp();
        }

        function clearStratagemLoadout(shouldSync = true) {
            const overlaySlots = getSelectedPresetOverlayVisibility();
            for (let i = 1; i <= getStratagemSlotCount(); i++) {
                renderStratagemSlot(document.getElementById(`slot-${i}`), i, '', '', overlaySlots?.[i - 1] ?? null);
            }

            if (shouldSync) syncCurrentLoadoutToApp();
        }

        function handleStratagemSlotClick(event, index) {
            const modifierState = window.hd2ModifierState || {};
            const shiftPressed = event?.shiftKey || modifierState.shift === true;
            if (!shiftPressed) {
                openModal('스트라타젬', index);
                return;
            }

            event.preventDefault();
            event.stopPropagation();

            const preset = presets.find(item => item.id === selectedPresetId);
            if (!preset) return;

            const overlaySlots = normalizeOverlaySlotVisibility(preset.overlaySlots);
            overlaySlots[index - 1] = !overlaySlots[index - 1];
            preset.overlaySlots = overlaySlots;
            renderStratagemOverlayState(document.getElementById(`slot-${index}`), overlaySlots[index - 1]);
            syncCurrentLoadoutToApp();
            // 휠 표시 여부도 스트라타젬 프리셋 데이터이므로 자동저장 ON일 때만 즉시 기록한다.
            queueActivePresetAutoSave();
        }

        function clearEquipmentLoadout(shouldSync = true) {
            ['selected-armor', 'selected-primary', 'selected-secondary', 'selected-grenade'].forEach(targetId => {
                clearLoadoutBoxById(targetId);
            });

            if (shouldSync) syncCurrentLoadoutToApp();
        }

        function clearAllLoadout(shouldSync = true) {
            clearStratagemLoadout(false);
            clearEquipmentLoadout(false);
            if (shouldSync) syncCurrentLoadoutToApp();
        }

        function resetLoadout() {
            // 프리셋 연결을 해제하며 비우는 경우도 일반 슬롯 초기화와 같은 한 단계 취소 대상으로 둔다.
            recordPresetEditBeforeChange();
            clearAllLoadout();
            selectedPresetId = '';
            renderPresetTabs();
        }

        function clearCurrentSelectionOnly() {
            openConfirmModal(
                '선택 초기화',
                '현재 프리셋에서 선택한 모든 항목들이 초기화됩니다.\n저장된 데이터는 안전하게 유지됩니다.',
                '초기화',
                () => {
                    // 여러 슬롯을 한꺼번에 비워도 Ctrl+Z 한 번으로 복원되도록 한 개의 기록만 남긴다.
                    recordPresetEditBeforeChange();
                    clearAllLoadout();
                    renderPresetTabs();
                }
            );
        }

        function normalizePresetList(source, kind) {
            if (!Array.isArray(source)) return [];

            return source
                .filter(preset => preset && typeof preset === 'object')
                .map((preset, index) => ({
                    id: typeof preset.id === 'string' && preset.id ? preset.id : `preset-${Date.now()}-${index}`,
                    name: typeof preset.name === 'string' && preset.name.trim() ? preset.name.trim() : `프리셋 ${index + 1}`,
                    loadout: kind === 'stratagem'
                        ? normalizeStratagemLoadout(preset.loadout)
                        : normalizeEquipmentLoadout(preset.loadout),
                    ...(kind === 'stratagem'
                        ? {
                            supportWeapon: normalizePresetSupportWeaponSettings(preset.supportWeapon),
                            overlaySlots: normalizeOverlaySlotVisibility(preset.overlaySlots),
                            // 장비 프리셋은 독립 목록으로 두되, 스트라타젬 프리셋이 마지막으로 연결한 항목을 기억한다.
                            equipmentPresetId: typeof preset.equipmentPresetId === 'string' ? preset.equipmentPresetId : ''
                        }
                        : {})
                }));
        }

        function normalizePresetCollections(source) {
            if (Array.isArray(source)) {
                // 이전 통합 프리셋은 같은 이름을 가진 두 종류의 프리셋으로 자동 분리한다.
                return {
                    stratagemPresets: normalizePresetList(source, 'stratagem'),
                    equipmentPresets: source.filter(Boolean).map((preset, index) => ({
                        id: `equipment-${typeof preset.id === 'string' && preset.id ? preset.id : index + 1}`,
                        name: typeof preset.name === 'string' && preset.name.trim() ? preset.name.trim() : `장비 프리셋 ${index + 1}`,
                        loadout: normalizeEquipmentLoadout(preset.loadout)
                    }))
                };
            }

            if (!source || typeof source !== 'object') {
                return { stratagemPresets: [], equipmentPresets: [] };
            }

            return {
                stratagemPresets: normalizePresetList(source.stratagemPresets, 'stratagem'),
                equipmentPresets: normalizePresetList(source.equipmentPresets, 'equipment')
            };
        }

        function normalizeStratagemLoadout(loadout = {}) {
            return {
                stratagems: Array.from({ length: getStratagemSlotCount() }, (_, index) => {
                    const value = Array.isArray(loadout.stratagems) ? loadout.stratagems[index] : '';
                    return typeof value === 'string' ? value : '';
                })
            };
        }

        function normalizeEquipmentLoadout(loadout = {}) {
            return {
                armor: typeof loadout.armor === 'string' ? loadout.armor : '',
                primary: typeof loadout.primary === 'string' ? loadout.primary : '',
                secondary: typeof loadout.secondary === 'string' ? loadout.secondary : '',
                grenade: typeof loadout.grenade === 'string' ? loadout.grenade : ''
            };
        }

        function normalizePresetLoadout(loadout = {}) {
            return {
                ...normalizeStratagemLoadout(loadout),
                ...normalizeEquipmentLoadout(loadout)
            };
        }

        function getCurrentLoadout() {
            return {
                stratagems: Array.from({ length: getStratagemSlotCount() }, (_, index) => {
                    return document.getElementById(`slot-${index + 1}`)?.dataset.itemName || '';
                }),
                overlaySlots: Array.from({ length: getStratagemSlotCount() }, (_, index) => {
                    return document.getElementById(`slot-${index + 1}`)?.dataset.overlayVisible === 'true';
                }),
                armor: document.getElementById('selected-armor')?.dataset.itemName || '',
                primary: document.getElementById('selected-primary')?.dataset.itemName || '',
                secondary: document.getElementById('selected-secondary')?.dataset.itemName || '',
                grenade: document.getElementById('selected-grenade')?.dataset.itemName || ''
            };
        }

        function getPresetEditHistoryKey() {
            // 장비 프리셋도 독립 편집 단위이므로 두 선택 ID를 함께 키로 사용한다.
            return `${selectedPresetId || '__runtime__'}::${selectedEquipmentPresetId || '__none__'}`;
        }

        function createPresetEditSnapshot() {
            const loadout = getCurrentLoadout();
            return {
                // 휠 표시 여부는 이 기능의 대상이 아니므로, 실행 취소가 따로 바꿔 버리지 않게 제외한다.
                stratagems: [...loadout.stratagems],
                armor: loadout.armor,
                primary: loadout.primary,
                secondary: loadout.secondary,
                grenade: loadout.grenade
            };
        }

        function arePresetEditSnapshotsEqual(left, right) {
            if (!left || !right) return false;
            return left.armor === right.armor
                && left.primary === right.primary
                && left.secondary === right.secondary
                && left.grenade === right.grenade
                && left.stratagems.length === right.stratagems.length
                && left.stratagems.every((name, index) => name === right.stratagems[index]);
        }

        function getPresetEditHistory() {
            const key = getPresetEditHistoryKey();
            let history = presetEditHistories.get(key);
            if (!history) {
                history = { undo: [], redo: [] };
                presetEditHistories.set(key, history);
            }
            return history;
        }

        function recordPresetEditBeforeChange() {
            const history = getPresetEditHistory();
            const snapshot = createPresetEditSnapshot();
            const previous = history.undo[history.undo.length - 1];
            if (!arePresetEditSnapshotsEqual(previous, snapshot)) {
                history.undo.push(snapshot);
                if (history.undo.length > presetEditHistoryLimit) history.undo.shift();
            }
            // 새 편집은 현재 프리셋 조합의 되돌리기 분기만 초기화한다.
            history.redo.length = 0;
        }

        async function restorePresetEditSnapshot(snapshot) {
            if (!snapshot) return;

            // 실행 취소는 아이템만 되돌리고 현재 휠 표시 상태는 그대로 유지한다.
            const overlaySlots = getCurrentLoadout().overlaySlots;
            await applyStratagemPresetLoadout({ stratagems: snapshot.stratagems }, overlaySlots, false);
            await applyEquipmentPresetLoadout(snapshot, false);
            syncCurrentLoadoutToApp();
        }

        async function undoPresetEdit() {
            const history = getPresetEditHistory();
            const snapshot = history.undo.pop();
            if (!snapshot) return false;

            history.redo.push(createPresetEditSnapshot());
            await restorePresetEditSnapshot(snapshot);
            return true;
        }

        async function redoPresetEdit() {
            const history = getPresetEditHistory();
            const snapshot = history.redo.pop();
            if (!snapshot) return false;

            history.undo.push(createPresetEditSnapshot());
            await restorePresetEditSnapshot(snapshot);
            return true;
        }

        // F3의 키보드 후킹도 같은 프리셋 단위 기록을 호출할 수 있도록 전역으로 노출한다.
        window.hd2UndoPresetEdit = undoPresetEdit;
        window.hd2RedoPresetEdit = redoPresetEdit;

        function getCurrentPresetSupportWeapon() {
            return normalizePresetSupportWeaponSettings(currentSupportWeaponSettings || {});
        }

        function syncCurrentLoadoutToApp() {
            postAppMessage({ type: 'CURRENT_LOADOUT', loadout: getCurrentLoadout() });
            queueActivePresetAutoSave();
        }

        function queueActivePresetAutoSave() {
            if (!presetAutoSaveEnabled || !selectedPresetId) return;

            // 드래그와 연속 선택은 한 프레임 안에 여러 변경을 만들 수 있어, 마지막 상태만 한 번 저장한다.
            clearTimeout(pendingPresetAutoSaveTimer);
            pendingPresetAutoSaveTimer = setTimeout(() => saveActivePresetState(), 0);
        }

        function saveActivePresetState(showFeedback = false) {
            const stratagemPreset = presets.find(item => item.id === selectedPresetId);
            if (!stratagemPreset) return;

            const loadout = getCurrentLoadout();
            stratagemPreset.loadout = normalizeStratagemLoadout(loadout);
            stratagemPreset.supportWeapon = getCurrentPresetSupportWeapon();
            stratagemPreset.overlaySlots = normalizeOverlaySlotVisibility(loadout.overlaySlots);
            stratagemPreset.equipmentPresetId = selectedEquipmentPresetId || '';

            const equipmentPreset = equipmentPresets.find(item => item.id === selectedEquipmentPresetId);
            if (equipmentPreset) equipmentPreset.loadout = normalizeEquipmentLoadout(loadout);

            // 연결과 양쪽 프리셋 내용을 하나의 저장 메시지로 보낸다. 두 WebView가 서로 다른 부분을 덮어쓰지 않게 한다.
            savePresets();
            saveSelectedPresetId();
            saveSelectedEquipmentPresetId();
            renderPresetTabs();
            renderEquipmentPresetTabs();
            if (showFeedback) showPresetSaveFeedback(selectedPresetId);
        }

        function getLinkedEquipmentPreset(preset) {
            const linkedId = typeof preset?.equipmentPresetId === 'string' ? preset.equipmentPresetId : '';
            return linkedId ? equipmentPresets.find(item => item.id === linkedId) || null : null;
        }

        function applyLinkedEquipmentPreset(preset, saveSelection = false, shouldSync = true) {
            const equipmentPreset = getLinkedEquipmentPreset(preset);
            if (!equipmentPreset) return false;

            selectedEquipmentPresetId = equipmentPreset.id;
            applyEquipmentPresetLoadout(equipmentPreset.loadout, shouldSync);
            renderEquipmentPresetTabs();
            if (saveSelection) saveSelectedEquipmentPresetId();
            return true;
        }

        function linkSelectedEquipmentPresetToCurrentStratagem() {
            const stratagemPreset = presets.find(item => item.id === selectedPresetId);
            if (!stratagemPreset || !presetAutoSaveEnabled) return;

            // 자동저장 ON에서만 연결 ID를 기록 대상으로 잡는다. 실제 파일 저장은 완성된 현재 상태를 동기화한 뒤 한 번만 수행한다.
            stratagemPreset.equipmentPresetId = selectedEquipmentPresetId || '';
            queueActivePresetAutoSave();
        }

        async function applyCurrentLoadoutFromApp(loadout) {
            // 앱에서 다시 배포한 값은 현재 화면만 갱신하고 CURRENT_LOADOUT을 재전송하지 않아 동기화 루프를 막는다.
            await applyStratagemPresetLoadout(loadout, loadout.overlaySlots, false);
            await applyEquipmentPresetLoadout(loadout, false);
        }

        async function applyPresetLoadout(loadout, shouldSync = true) {
            const renderToken = ++loadoutRenderToken;
            const presetLoadout = normalizePresetLoadout(loadout);
            if (renderToken !== loadoutRenderToken) return;

            const equipmentImageUrls = [
                presetLoadout.armor ? getCachedDisplayImageUrl('방어구', presetLoadout.armor) : '',
                presetLoadout.primary ? getCachedDisplayImageUrl('주 무기', presetLoadout.primary) : '',
                presetLoadout.secondary ? getCachedDisplayImageUrl('보조 무기', presetLoadout.secondary) : '',
                presetLoadout.grenade ? getCachedDisplayImageUrl('투척 무기', presetLoadout.grenade) : ''
            ];
            const stratagemImageUrls = presetLoadout.stratagems.map(name => name ? getItemImageUrl('스트라타젬', name) : '');

            presetLoadout.stratagems.forEach((name, index) => {
                renderStratagemSlot(
                    document.getElementById(`slot-${index + 1}`),
                    index + 1,
                    name,
                    stratagemImageUrls[index] || ''
                );
            });

            renderLoadoutBox('방어구', presetLoadout.armor, equipmentImageUrls[0]);
            renderLoadoutBox('주 무기', presetLoadout.primary, equipmentImageUrls[1]);
            renderLoadoutBox('보조 무기', presetLoadout.secondary, equipmentImageUrls[2]);
            renderLoadoutBox('투척 무기', presetLoadout.grenade, equipmentImageUrls[3]);
            if (shouldSync) syncCurrentLoadoutToApp();
        }

        async function applyStratagemPresetLoadout(loadout, overlaySlots = getSelectedPresetOverlayVisibility(), shouldSync = true) {
            const renderToken = ++loadoutRenderToken;
            const presetLoadout = normalizeStratagemLoadout(loadout);
            const normalizedOverlaySlots = Array.isArray(overlaySlots) ? normalizeOverlaySlotVisibility(overlaySlots) : null;
            const imageUrls = presetLoadout.stratagems.map(name => name ? getItemImageUrl('스트라타젬', name) : '');
            if (renderToken !== loadoutRenderToken) return;

            presetLoadout.stratagems.forEach((name, index) => {
                renderStratagemSlot(
                    document.getElementById(`slot-${index + 1}`),
                    index + 1,
                    name,
                    imageUrls[index] || '',
                    normalizedOverlaySlots ? normalizedOverlaySlots[index] : null
                );
            });
            if (shouldSync) syncCurrentLoadoutToApp();
        }

        async function applyEquipmentPresetLoadout(loadout, shouldSync = true) {
            const renderToken = ++loadoutRenderToken;
            const presetLoadout = normalizeEquipmentLoadout(loadout);
            const values = [
                ['방어구', presetLoadout.armor], ['주 무기', presetLoadout.primary],
                ['보조 무기', presetLoadout.secondary], ['투척 무기', presetLoadout.grenade]
            ];
            const imageUrls = values.map(([type, name]) => name ? getCachedDisplayImageUrl(type, name) : '');
            if (renderToken !== loadoutRenderToken) return;

            values.forEach(([type, name], index) => renderLoadoutBox(type, name, imageUrls[index] || ''));
            if (shouldSync) syncCurrentLoadoutToApp();
        }

        function applyPresetSupportWeaponSettings(supportWeapon) {
            currentSupportWeaponSettings = mergeGlobalWarningWithPresetSupport(currentSupportWeaponSettings || {}, supportWeapon || {});
            renderSupportWeaponSettings(currentSupportWeaponSettings);
            postAppMessage({ type: 'SET_SUPPORT_WEAPON_SETTINGS', settings: currentSupportWeaponSettings });
        }

        document.getElementById('preset-tabs-bar')?.addEventListener('wheel', (e) => {
            if (e.deltaY === 0) return;

            e.preventDefault();
            e.currentTarget.scrollLeft += e.deltaY;
        }, { passive: false });
        document.getElementById('preset-tabs-bar')?.addEventListener('scroll', updatePresetSelectedRule);
        document.getElementById('equipment-preset-tabs-bar')?.addEventListener('wheel', (e) => {
            if (e.deltaY === 0) return;
            e.preventDefault();
            e.currentTarget.scrollLeft += e.deltaY;
        }, { passive: false });
        document.getElementById('equipment-preset-tabs-bar')?.addEventListener('scroll', updateEquipmentPresetSelectedRule);
        document.getElementById('equipment-preset-tabs-bar')?.addEventListener('dragover', handleEquipmentPresetDragOver);
        document.getElementById('equipment-preset-tabs-bar')?.addEventListener('drop', handleEquipmentPresetDrop);

        function renderPresetTabs() {
            const container = document.getElementById('preset-tabs-bar');
            if (!container) return;

            container.innerHTML = '';
            container.setAttribute('role', 'tablist');
            updatePrimaryLoadoutAction();

            // 기본 프리셋 탭은 표시하지 않고, 저장된 사용자 프리셋만 탭으로 렌더링한다.
            presets.forEach(preset => {
                const tab = document.createElement('span');
                tab.className = `preset-tab${preset.id === selectedPresetId ? ' selected' : ''}`;
                tab.innerHTML = editingPresetId === preset.id
                    ? `<span class="preset-rename-inline" contenteditable="true" spellcheck="false" tabindex="-1">${escapeHtml(preset.name)}</span>`
                    : `<span>${escapeHtml(preset.name)}</span>`;
                tab.setAttribute('tabindex', '-1');
                tab.setAttribute('role', 'tab');
                tab.setAttribute('aria-selected', preset.id === selectedPresetId ? 'true' : 'false');
                tab.setAttribute('draggable', editingPresetId === preset.id ? 'false' : 'true');
                tab.dataset.presetId = preset.id;
                tab.addEventListener('click', (e) => handlePresetTabClick(e, preset.id));
                tab.addEventListener('dragstart', handlePresetDragStart);
                tab.addEventListener('dragend', handlePresetDragEnd);
                tab.addEventListener('dblclick', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    startPresetInlineRename(preset.id);
                });
                tab.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    handlePresetContextMenu(e, preset.id);
                });
                container.appendChild(tab);
            });

            const addTab = document.createElement('span');
            addTab.className = 'preset-tab add';
            addTab.textContent = '＋';
            addTab.setAttribute('tabindex', '-1');
            addTab.setAttribute('role', 'button');
            addTab.setAttribute('aria-label', '프리셋 추가');
            addTab.addEventListener('click', addPreset);
            container.appendChild(addTab);

            const editingInput = container.querySelector('.preset-rename-inline');
            if (editingInput) {
                editingInput.addEventListener('click', (e) => e.stopPropagation());
                editingInput.addEventListener('dblclick', (e) => e.stopPropagation());
                editingInput.addEventListener('keydown', handlePresetInlineRenameKey);
                editingInput.addEventListener('blur', confirmPresetInlineRename);
                setTimeout(() => {
                    editingInput.focus();
                    selectEditableText(editingInput);
                }, 0);
            }

            updatePresetSelectedRule();
        }

        function updatePresetSelectedRule() {
            if (presetSelectedRuleFrame) return;

            presetSelectedRuleFrame = requestAnimationFrame(() => {
                presetSelectedRuleFrame = 0;
                const container = document.getElementById('preset-tabs-bar');
                const indicator = document.getElementById('preset-tabs-selected-rule');
                const selectedTab = container?.querySelector('.preset-tab.selected');
                if (!container || !indicator || !selectedTab) {
                    document.documentElement.style.setProperty('--preset-selected-rule-display', 'none');
                    return;
                }

                const tabLeft = selectedTab.offsetLeft - container.scrollLeft;
                const tabRight = tabLeft + selectedTab.offsetWidth;
                const left = Math.max(0, tabLeft);
                const right = Math.min(container.clientWidth, tabRight);
                const width = Math.max(0, right - left);

                document.documentElement.style.setProperty('--preset-selected-rule-left', `${left}px`);
                document.documentElement.style.setProperty('--preset-selected-rule-width', `${width}px`);
                document.documentElement.style.setProperty('--preset-selected-rule-display', width > 0 ? 'block' : 'none');
            });
        }

        function renderEquipmentPresetTabs() {
            const container = document.getElementById('equipment-preset-tabs-bar');
            if (!container) return;

            container.innerHTML = '';
            container.setAttribute('role', 'tablist');
            updatePrimaryLoadoutAction();

            equipmentPresets.forEach(preset => {
                const tab = document.createElement('span');
                tab.className = `preset-tab${preset.id === selectedEquipmentPresetId ? ' selected' : ''}`;
                tab.innerHTML = editingEquipmentPresetId === preset.id
                    ? `<span class="preset-rename-inline equipment-preset-rename-inline" contenteditable="true" spellcheck="false" tabindex="-1">${escapeHtml(preset.name)}</span>`
                    : `<span>${escapeHtml(preset.name)}</span>`;
                tab.setAttribute('tabindex', '-1');
                tab.setAttribute('role', 'tab');
                tab.setAttribute('aria-selected', preset.id === selectedEquipmentPresetId ? 'true' : 'false');
                tab.setAttribute('draggable', editingEquipmentPresetId === preset.id ? 'false' : 'true');
                tab.dataset.presetId = preset.id;
                tab.addEventListener('click', (e) => handleEquipmentPresetTabClick(e, preset.id));
                tab.addEventListener('dragstart', handleEquipmentPresetDragStart);
                tab.addEventListener('dragend', handleEquipmentPresetDragEnd);
                tab.addEventListener('dblclick', (e) => {
                    e.preventDefault(); e.stopPropagation(); startEquipmentPresetInlineRename(preset.id);
                });
                tab.addEventListener('contextmenu', (e) => {
                    e.preventDefault(); e.stopPropagation(); handleEquipmentPresetContextMenu(e, preset.id);
                });
                container.appendChild(tab);
            });

            const addTab = document.createElement('span');
            addTab.className = 'preset-tab add';
            addTab.textContent = '＋';
            addTab.setAttribute('tabindex', '-1');
            addTab.setAttribute('role', 'button');
            addTab.setAttribute('aria-label', '장비 프리셋 추가');
            addTab.addEventListener('click', () => addEquipmentPreset());
            container.appendChild(addTab);

            const editingInput = container.querySelector('.equipment-preset-rename-inline');
            if (editingInput) {
                editingInput.addEventListener('click', (e) => e.stopPropagation());
                editingInput.addEventListener('keydown', handleEquipmentPresetInlineRenameKey);
                editingInput.addEventListener('blur', confirmEquipmentPresetInlineRename);
                setTimeout(() => { editingInput.focus(); selectEditableText(editingInput); }, 0);
            }
            updateEquipmentPresetSelectedRule();
        }

        function updateEquipmentPresetSelectedRule() {
            requestAnimationFrame(() => {
                const container = document.getElementById('equipment-preset-tabs-bar');
                const indicator = document.getElementById('equipment-preset-tabs-selected-rule');
                const selectedTab = container?.querySelector('.preset-tab.selected');
                if (!container || !indicator || !selectedTab) {
                    indicator?.style.setProperty('display', 'none');
                    return;
                }
                const left = Math.max(0, selectedTab.offsetLeft - container.scrollLeft);
                const width = Math.max(0, Math.min(container.clientWidth, left + selectedTab.offsetWidth) - left);
                indicator.style.left = `${left}px`;
                indicator.style.width = `${width}px`;
                indicator.style.display = width > 0 ? 'block' : 'none';
            });
        }

        function updatePrimaryLoadoutAction() {
            const button = document.getElementById('loadout-action-primary');
            if (!button) return;
            button.classList.remove('saved-feedback');
            button.textContent = (selectedPresetId || selectedEquipmentPresetId) ? '프리셋 저장' : '무작위 선택';
        }

        function showPresetSaveFeedback(id) {
            const button = document.getElementById('loadout-action-primary');
            if (!button || (selectedPresetId !== id && selectedEquipmentPresetId !== id)) return;

            clearTimeout(presetSaveFeedbackTimer);
            button.textContent = '✓ 저장 완료';
            button.classList.add('saved-feedback');

            presetSaveFeedbackTimer = setTimeout(() => {
                if (selectedPresetId === id || selectedEquipmentPresetId === id) updatePrimaryLoadoutAction();
            }, 1000);
        }

        function handlePrimaryLoadoutAction() {
            if (selectedPresetId || selectedEquipmentPresetId) {
                if (selectedPresetId) saveSelectedPreset();
                if (selectedEquipmentPresetId) saveSelectedEquipmentPreset();
            } else {
                generateRandomLoadout();
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function selectEditableText(element) {
            const range = document.createRange();
            range.selectNodeContents(element);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function savePresets() {
            postAppMessage({
                type: 'SAVE_PRESETS',
                presets: { stratagemPresets: presets, equipmentPresets }
            });
        }

        function saveSelectedPresetId(id = selectedPresetId) {
            // 선택 변경만 따로 저장해 앱을 다시 열 때 마지막 탭을 복원한다.
            postAppMessage({ type: 'SET_SELECTED_PRESET', id: id || '' });
        }

        function saveSelectedEquipmentPresetId(id = selectedEquipmentPresetId) {
            postAppMessage({ type: 'SET_SELECTED_EQUIPMENT_PRESET', id: id || '' });
        }

        function applyPendingSelectedPreset() {
            // 설정, 프리셋 목록, 장비 투명 이미지 캐시는 비동기로 도착하므로 모두 준비된 뒤 복원한다.
            if (!presetsLoaded || !equipmentPresetsLoaded || !imageCacheReady) return;

            const preset = pendingSelectedPresetId ? presets.find(item => item.id === pendingSelectedPresetId) : null;
            if (currentLoadoutSyncReceived) {
                // C#이 이미 현재 편집 상태를 보냈다면, 저장된 프리셋 내용으로 덮어쓰지 않고 선택 탭만 복원한다.
                if (preset) selectedPresetId = preset.id;

                const equipmentId = pendingSelectedEquipmentPresetId || getLinkedEquipmentPreset(preset)?.id || '';
                const equipmentPreset = equipmentPresets.find(item => item.id === equipmentId);
                if (equipmentPreset) selectedEquipmentPresetId = equipmentPreset.id;

                pendingSelectedPresetId = '';
                pendingSelectedEquipmentPresetId = '';
                // 초기 동기화가 투명 이미지 캐시보다 먼저 도착할 수 있어, 캐시 완료 후 장비 이미지를 한 번 다시 그린다.
                applyCurrentLoadoutFromApp(getCurrentLoadout());
                renderPresetTabs();
                renderEquipmentPresetTabs();
                return;
            }
            if (!pendingSelectedPresetId) {
                const equipmentPreset = equipmentPresets.find(item => item.id === pendingSelectedEquipmentPresetId);
                if (!equipmentPreset) {
                    if (pendingSelectedEquipmentPresetId) saveSelectedEquipmentPresetId('');
                } else if (selectedEquipmentPresetId !== equipmentPreset.id) {
                    selectedEquipmentPresetId = equipmentPreset.id;
                    applyEquipmentPresetLoadout(equipmentPreset.loadout);
                }
                pendingSelectedEquipmentPresetId = '';
                renderEquipmentPresetTabs();
                return;
            }
            if (!preset) {
                // 저장된 id가 삭제된 프리셋이면 다음 실행에서 다시 찾지 않도록 정리한다.
                saveSelectedPresetId('');
                pendingSelectedPresetId = '';
                return;
            }

            if (selectedPresetId === preset.id) {
                pendingSelectedPresetId = '';
                if (!applyLinkedEquipmentPreset(preset, false, false)) applyPendingEquipmentPreset();
                return;
            }

            selectedPresetId = preset.id;
            pendingSelectedPresetId = '';
            applyStratagemPresetLoadout(preset.loadout, preset.overlaySlots, false);
            applyPresetSupportWeaponSettings(preset.supportWeapon);
            renderPresetTabs();
            if (!applyLinkedEquipmentPreset(preset, false, false)) applyPendingEquipmentPreset();
        }

        function applyPendingEquipmentPreset() {
            if (!equipmentPresetsLoaded || !imageCacheReady) return;
            const equipmentPreset = equipmentPresets.find(item => item.id === pendingSelectedEquipmentPresetId);
            if (!equipmentPreset) {
                if (pendingSelectedEquipmentPresetId) saveSelectedEquipmentPresetId('');
            } else if (selectedEquipmentPresetId !== equipmentPreset.id) {
                selectedEquipmentPresetId = equipmentPreset.id;
                applyEquipmentPresetLoadout(equipmentPreset.loadout, false);
            }
            pendingSelectedEquipmentPresetId = '';
            renderEquipmentPresetTabs();
        }

        function handlePresetDragStart(e) {
            draggedPresetId = this.dataset.presetId || '';
            presetOrderChanged = false;

            this.classList.add('dragging');

            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedPresetId);
            clearTimeout(presetDragShieldTimer);
            presetDragShieldTimer = setTimeout(() => {
                if (draggedPresetId) createPresetDragShields();
            }, 0);

            const ghost = document.createElement('div');
            ghost.style.width = '1px';
            ghost.style.height = '1px';

            document.body.appendChild(ghost);
            e.dataTransfer.setDragImage(ghost, 0, 0);

            setTimeout(() => ghost.remove(), 0);
        }

        function handlePresetDragEnd() {
            this.classList.remove('dragging');

            clearPresetDraggingState();

            draggedPresetId = '';
            removePresetDragShields();
            if (presetOrderChanged) {
                savePresets();
                presetOrderChanged = false;
            }
        }

        function createPresetDragShields() {
            removePresetDragShields();

            [
                document.getElementById('preset-tabs-bar')
            ].filter(Boolean).forEach(container => {
                const rect = container.getBoundingClientRect();
                if (rect.width <= 0 || rect.height <= 0) return;

                const shield = document.createElement('div');
                shield.className = 'preset-drag-shield';
                shield.style.left = `${rect.left}px`;
                shield.style.top = `${rect.top}px`;
                shield.style.width = `${rect.width}px`;
                shield.style.height = `${rect.height}px`;
                shield.addEventListener('dragover', (e) => {
                    handlePresetListDragOver(e, container);
                    e.stopPropagation();
                });
                shield.addEventListener('drop', (e) => {
                    handlePresetListDrop(e, container);
                    e.stopPropagation();
                });
                document.body.appendChild(shield);
                presetDragShields.push(shield);
            });
        }

        function removePresetDragShields() {
            clearTimeout(presetDragShieldTimer);
            presetDragShields.forEach(shield => shield.remove());
            presetDragShields = [];
            stopPresetDragAutoScroll();
        }

        function suppressNextPresetClick() {
            suppressPresetClick = true;
            clearTimeout(suppressPresetClickTimer);
            suppressPresetClickTimer = setTimeout(() => {
                suppressPresetClick = false;
            }, 150);
        }

        function getPresetDropContainer(e) {
            const tabBar = document.getElementById('preset-tabs-bar');

            if (tabBar) {
                const rect = tabBar.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    return tabBar;
                }
            }

            return null;
        }

        function setPresetDragEffect(e, effect) {
            e.preventDefault();
            if (e.dataTransfer) e.dataTransfer.dropEffect = effect;
        }

        function handleDocumentPresetDragOver(e) {
            if (!draggedPresetId) return;

            const presetList = getPresetDropContainer(e);
            if (presetList) {
                handlePresetListDragOver(e, presetList);
                return;
            }

            setPresetDragEffect(e, 'none');
        }

        function handleDocumentPresetDrop(e) {
            if (!draggedPresetId) return;

            const presetList = getPresetDropContainer(e);
            if (presetList) {
                handlePresetListDrop(e, presetList);
                return;
            }

            e.preventDefault();
            e.stopPropagation();
            suppressNextPresetClick();
            removePresetDragShields();
        }

        function handlePresetListDragOver(e, container) {
            updatePresetDragAutoScroll(e, container);
            const dropState = getPresetListDropState(container, e);
            reorderPresetDuringDrag(container, dropState);
            setPresetDragEffect(e, 'move');
        }

        function updatePresetDragAutoScroll(e, container) {
            presetDragAutoScrollContainer = container;
            presetDragPointerX = e.clientX;
            presetDragPointerY = e.clientY;

            if (!presetDragAutoScrollFrame) {
                presetDragLastScrollTime = 0;
                presetDragAutoScrollFrame = requestAnimationFrame(runPresetDragAutoScroll);
            }
        }

        function runPresetDragAutoScroll(timestamp) {
            const container = presetDragAutoScrollContainer;
            if (!draggedPresetId || !container) {
                stopPresetDragAutoScroll();
                return;
            }

            const rect = container.getBoundingClientRect();
            const maxScrollLeft = container.scrollWidth - container.clientWidth;
            if (maxScrollLeft <= 0) {
                presetDragLastScrollTime = timestamp;
                presetDragAutoScrollFrame = requestAnimationFrame(runPresetDragAutoScroll);
                return;
            }

            const edgeSize = Math.min(96, Math.max(64, rect.width * 0.14));
            const minSpeed = 70;
            const maxSpeed = 720;
            let direction = 0;
            let strength = 0;

            if (presetDragPointerX < rect.left + edgeSize && container.scrollLeft > 0) {
                direction = -1;
                strength = (rect.left + edgeSize - presetDragPointerX) / edgeSize;
            } else if (presetDragPointerX > rect.right - edgeSize && container.scrollLeft < maxScrollLeft) {
                direction = 1;
                strength = (presetDragPointerX - (rect.right - edgeSize)) / edgeSize;
            }

            strength = Math.max(0, Math.min(1, strength));

            if (direction && strength) {
                const dt = presetDragLastScrollTime ? Math.min(40, timestamp - presetDragLastScrollTime) : 16;
                const before = container.scrollLeft;
                const easedStrength = strength * strength * (3 - 2 * strength);
                const speed = minSpeed + (maxSpeed - minSpeed) * easedStrength;
                container.scrollLeft = Math.max(0, Math.min(maxScrollLeft, before + direction * speed * (dt / 1000)));

                if (container.scrollLeft !== before) {
                    const dropState = getPresetListDropState(container, {
                        clientX: presetDragPointerX,
                        clientY: presetDragPointerY
                    });
                    reorderPresetDuringDrag(container, dropState);
                }
            }

            presetDragLastScrollTime = timestamp;
            presetDragAutoScrollFrame = requestAnimationFrame(runPresetDragAutoScroll);
        }

        function stopPresetDragAutoScroll() {
            if (presetDragAutoScrollFrame) cancelAnimationFrame(presetDragAutoScrollFrame);
            presetDragAutoScrollFrame = 0;
            presetDragAutoScrollContainer = null;
            presetDragLastScrollTime = 0;
        }

        function reorderPresetDuringDrag(container, dropState) {
            if (!dropState) return false;

            document.querySelector(`.preset-tab[data-preset-id="${CSS.escape(draggedPresetId)}"]`)?.classList.add('dragging');

            const [movedPreset] = presets.splice(dropState.fromIndex, 1);
            presets.splice(dropState.toIndex, 0, movedPreset);
            presetOrderChanged = true;
            syncPresetTabDomOrder(container);
            updatePresetSelectedRule();
            return true;
        }

        function syncPresetTabDomOrder(container) {
            const addTab = container.querySelector('.preset-tab.add');
            presets.forEach(preset => {
                const tab = container.querySelector(`.preset-tab[data-preset-id="${CSS.escape(preset.id)}"]`);
                if (tab) container.insertBefore(tab, addTab);
            });
        }

        function handlePresetListDrop(e, container) {
            e.preventDefault();
            e.stopPropagation();

            suppressNextPresetClick();
            removePresetDragShields();
            clearPresetDraggingState();
            document.activeElement?.blur();
            if (presetOrderChanged) {
                savePresets();
                presetOrderChanged = false;
            }
        }

        function getPresetListDropState(container, e) {
            if (!draggedPresetId || presets.length === 0) return null;

            const fromIndex = presets.findIndex(preset => preset.id === draggedPresetId);
            if (fromIndex < 0) return null;

            const selector = '.preset-tab[data-preset-id]';
            const items = [...container.querySelectorAll(selector)];
            if (items.length === 0) return null;

            let insertIndex = items.length;

            for (let i = 0; i < items.length; i++) {
                const rect = items[i].getBoundingClientRect();

                const midpoint = rect.left + rect.width / 2;

                const mousePos = e.clientX;

                if (mousePos < midpoint) {
                    insertIndex = i;
                    break;
                }
            }

            let toIndex = insertIndex;
            if (fromIndex < toIndex) toIndex--;
            if (toIndex === fromIndex) return null;

            return {
                fromIndex,
                toIndex
            };
        }

        function clearPresetDraggingState() {
            document.querySelectorAll('.preset-tab.dragging').forEach(item => item.classList.remove('dragging'));
        }

        function getNextPresetName() {
            let index = 1;
            const names = new Set(presets.map(preset => preset.name));
            while (names.has(`프리셋 ${index}`)) index++;
            return `프리셋 ${index}`;
        }

        function getDuplicatePresetName(name) {
            const baseName = `${name} 복사본`;
            const names = new Set(presets.map(preset => preset.name));
            if (!names.has(baseName)) return baseName;

            let index = 2;
            while (names.has(`${baseName} ${index}`)) index++;
            return `${baseName} ${index}`;
        }

        function addPreset(insertAfterId = '') {
            const preset = {
                id: `preset-${Date.now()}`,
                name: getNextPresetName(),
                loadout: normalizeStratagemLoadout(),
                supportWeapon: getCurrentPresetSupportWeapon(),
                overlaySlots: getDefaultOverlaySlotVisibility(),
                // 새 스트라타젬 프리셋은 장비 프리셋을 아직 강제로 연결하지 않는다.
                equipmentPresetId: ''
            };

            const insertIndex = insertAfterId
                ? presets.findIndex(item => item.id === insertAfterId) + 1
                : presets.length;
            const safeInsertIndex = insertIndex > 0 ? insertIndex : presets.length;
            presets.splice(safeInsertIndex, 0, preset);
            selectedPresetId = preset.id;
            applyStratagemPresetLoadout(preset.loadout);
            applyPresetSupportWeaponSettings(preset.supportWeapon);
            renderPresetTabs();

            requestAnimationFrame(() => {
                const container = document.getElementById('preset-tabs-bar');
                const selectedTab = container?.querySelector('.preset-tab.selected');

                if (!container) return;
                if (selectedTab) {
                    selectedTab.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'nearest'
                    });
                    return;
                }

                container.scrollTo({
                    left: container.scrollWidth,
                    behavior: 'smooth'
                });
            });

            savePresets();
            saveSelectedPresetId();
        }

        function handlePresetTabClick(e, id) {
            const modifierState = window.hd2ModifierState || {};
            const shiftPressed = e?.shiftKey || modifierState.shift === true;
            const ctrlPressed = e?.ctrlKey || modifierState.ctrl === true;

            if (shiftPressed) {
                e.preventDefault();
                e.stopPropagation();
                // F3 편집창에서 Shift+좌클릭은 현재 로드아웃 탭 바로 뒤에 빈 탭을 추가한다.
                addPreset(id);
                return;
            }

            if (ctrlPressed) {
                e.preventDefault();
                e.stopPropagation();
                // Ctrl+좌클릭은 우클릭 삭제와 같은 확인 절차를 사용해 실수 삭제를 막는다.
                requestDeletePreset(id);
                return;
            }

            selectPreset(e, id);
        }

        function handlePresetContextMenu(e, id) {
            const modifierState = window.hd2ModifierState || {};
            const shiftPressed = e?.shiftKey || modifierState.shift === true;
            const ctrlPressed = e?.ctrlKey || modifierState.ctrl === true;

            // F3 편집창은 게임 포커스를 유지하므로, 우클릭 modifier도 후킹으로 전달된 상태를 같이 참고한다.
            if (shiftPressed) {
                duplicatePreset(id);
            } else if (ctrlPressed) {
                requestDeletePreset(id);
            }
        }

        function duplicatePreset(id) {
            const preset = presets.find(item => item.id === id);
            if (!preset) return;

            // 로드아웃은 새 객체로 정규화해 원본 프리셋과 배열 참조를 공유하지 않게 한다.
            const sourceIndex = presets.findIndex(item => item.id === id);
            const duplicatedPreset = {
                id: `preset-${Date.now()}`,
                name: getDuplicatePresetName(preset.name),
                loadout: normalizeStratagemLoadout(preset.loadout),
                supportWeapon: normalizePresetSupportWeaponSettings(preset.supportWeapon),
                overlaySlots: normalizeOverlaySlotVisibility(preset.overlaySlots),
                // 복제본도 원본이 고른 장비 프리셋을 그대로 연결해 같은 조합으로 바로 비교할 수 있게 한다.
                equipmentPresetId: typeof preset.equipmentPresetId === 'string' ? preset.equipmentPresetId : ''
            };

            presets.splice(sourceIndex + 1, 0, duplicatedPreset);
            selectedPresetId = duplicatedPreset.id;
            applyStratagemPresetLoadout(duplicatedPreset.loadout);
            applyPresetSupportWeaponSettings(duplicatedPreset.supportWeapon);
            renderPresetTabs();

            requestAnimationFrame(() => {
                const container = document.getElementById('preset-tabs-bar');
                const selectedTab = container?.querySelector('.preset-tab.selected');

                if (!container || !selectedTab) return;

                selectedTab.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest',
                    inline: 'nearest'
                });
            });

            savePresets();
            saveSelectedPresetId();
        }

        async function selectPreset(e, id) {
            if (suppressPresetClick) {
                e?.preventDefault();
                e?.stopPropagation();
                suppressPresetClick = false;
                clearTimeout(suppressPresetClickTimer);
                return;
            }

            const preset = presets.find(item => item.id === id);
            if (!preset) return;

            if (selectedPresetId === id) {
                return;
            }

            selectedPresetId = id;
            // 프리셋 실제 적용은 C# 런타임이 단독으로 처리한다. 각 WebView가 값을 다시 적용하면
            // 다른 탭의 지원무기 보조값이 마지막 메시지 순서에 따라 덮어써질 수 있다.
            saveSelectedPresetId();
            renderPresetTabs();

            requestAnimationFrame(() => {
                const container = document.getElementById('preset-tabs-bar');
                const selectedTab = container?.querySelector('.preset-tab.selected');

                if (!container || !selectedTab) return;

                const tabLeft = selectedTab.offsetLeft;
                const tabRight = tabLeft + selectedTab.offsetWidth;

                const viewLeft = container.scrollLeft;
                const viewRight = viewLeft + container.clientWidth;

                if (tabLeft < viewLeft) {
                    container.scrollTo({
                        left: tabLeft,
                        behavior: 'smooth'
                    });
                } else if (tabRight > viewRight) {
                    container.scrollTo({

            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', draggedEquipmentPresetId);
        }

        function handleEquipmentPresetDragEnd() {
            draggedEquipmentPresetId = '';
            document.querySelectorAll('#equipment-preset-tabs-bar .preset-tab.dragging')
                .forEach(tab => tab.classList.remove('dragging'));
        }

        function handleEquipmentPresetDragOver(e) {
            if (!draggedEquipmentPresetId) return;
            e.preventDefault();
            if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        }

        function handleEquipmentPresetDrop(e) {
            if (!draggedEquipmentPresetId) return;
            e.preventDefault();

            const container = e.currentTarget;
            const fromIndex = equipmentPresets.findIndex(preset => preset.id === draggedEquipmentPresetId);
            if (fromIndex < 0) return;

            const tabs = [...container.querySelectorAll('.preset-tab[data-preset-id]')];
            let insertIndex = tabs.length;
            for (let index = 0; index < tabs.length; index++) {
                const rect = tabs[index].getBoundingClientRect();
                if (e.clientX < rect.left + rect.width / 2) {
                    insertIndex = index;
                    break;
                }
            }

            let targetIndex = insertIndex;
            if (fromIndex < targetIndex) targetIndex--;
            if (targetIndex !== fromIndex) {
                const [preset] = equipmentPresets.splice(fromIndex, 1);
                equipmentPresets.splice(targetIndex, 0, preset);
                savePresets();
            }

            handleEquipmentPresetDragEnd();
            renderEquipmentPresetTabs();
        }

        function getNextEquipmentPresetName() {
            let index = 1;
            const names = new Set(equipmentPresets.map(preset => preset.name));
            while (names.has(`장비 프리셋 ${index}`)) index++;
            return `장비 프리셋 ${index}`;
        }

            const index = insertAfterId ? equipmentPresets.findIndex(item => item.id === insertAfterId) + 1 : equipmentPresets.length;
            equipmentPresets.splice(index > 0 ? index : equipmentPresets.length, 0, preset);

            saveSelectedEquipmentPresetId();

        function handleEquipmentPresetTabClick(e, id) {

            if (e?.shiftKey || modifierState.shift === true) {
                e.preventDefault(); e.stopPropagation(); addEquipmentPreset(id); return;

            if (e?.ctrlKey || modifierState.ctrl === true) {

        function handleEquipmentPresetContextMenu(e, id) {
            const modifierState = window.hd2ModifierState || {};
            if (e?.shiftKey || modifierState.shift === true) {
                const source = equipmentPresets.find(item => item.id === id);
                if (!source) return;
                const copy = {
                    id: `equipment-${Date.now()}`,
                    name: `${source.name} 복사본`,
                    loadout: normalizeEquipmentLoadout(source.loadout)
                };
                equipmentPresets.splice(equipmentPresets.findIndex(item => item.id === id) + 1, 0, copy);
                selectedEquipmentPresetId = copy.id;
                applyEquipmentPresetLoadout(copy.loadout);
                savePresets(); saveSelectedEquipmentPresetId(); renderEquipmentPresetTabs();

                requestDeleteEquipmentPreset(id);

        async function selectEquipmentPreset(id, saveSelection, shouldSync = true) {

            if (saveSelection) {

            if (saveSelection) {

                // 이 창이 현재 스트라타젬 프리셋의 편집 상태를 먼저 내보내는 것을 막는다.

        function requestDeleteEquipmentPreset(id) {

            if (!preset) return;

            // 스트라타젬 프리셋과 같은 확인 절차를 사용해 Ctrl+클릭/우클릭 삭제 실수를 막는다.
            openConfirmModal(
                `${preset.name} 삭제`,

            );

        function deleteEquipmentPreset(id) {
            const nextEquipmentPresets = equipmentPresets.filter(item => item.id !== id);
            if (nextEquipmentPresets.length === equipmentPresets.length) return;

            const removedSelectedPreset = selectedEquipmentPresetId === id;
            equipmentPresets = nextEquipmentPresets;
            // 삭제된 장비 프리셋을 가리키는 스트라타젬 프리셋은 빈 연결로 정리해 다음 선택 때 잘못된 장비를 불러오지 않는다.
            presets.forEach(preset => {
                if (preset.equipmentPresetId === id) preset.equipmentPresetId = '';
            });
            if (removedSelectedPreset) {
                // 장비 삭제도 스트라타젬 선택은 보존하고, 남은 첫 장비 프리셋만 적용한다.
                const nextPreset = equipmentPresets[0];

                if (nextPreset) {
                    applyEquipmentPresetLoadout(nextPreset.loadout);

                    clearEquipmentLoadout();
                }
                saveSelectedEquipmentPresetId(selectedEquipmentPresetId);
            }
            savePresets();
            renderEquipmentPresetTabs();

            preset.loadout = normalizeEquipmentLoadout(getCurrentLoadout());
            selectedEquipmentPresetId = id;

            saveSelectedEquipmentPresetId();

        function handleEquipmentPresetInlineRenameKey(e) {

            if (e.key === 'Escape') { editingEquipmentPresetId = ''; renderEquipmentPresetTabs(); }

        async function generateRandomLoadout() {
            if (!dbData) return;
            const renderToken = ++loadoutRenderToken;

            if (renderToken !== loadoutRenderToken) return;

            const stratPool = flattenDatabaseType('스트라타젬')
                .filter(item => item.Category !== '임무' && !excludedItems.has(item.Name))
                .sort(() => Math.random() - 0.5);

            let hasBackpack = false;
            let hasExosuit = false;
            let pickedCount = 0;
            const selectedStratagems = [];

            for (const item of stratPool) {
                if (pickedCount >= 4) break;

                const isBackpack = isBackpackStratagem(item);
                const isExosuit = isExosuitStratagem(item);

                if (isBackpack && hasBackpack) continue;
                if (isExosuit && hasExosuit) continue;

                pickedCount++;
                selectedStratagems.push(item);

                if (isBackpack) hasBackpack = true;
                if (isExosuit) hasExosuit = true;
            }

            const selectedLoadoutItems = [];
            ['방어구', '주 무기', '보조 무기', '투척 무기'].forEach(type => {
                const pool = flattenDatabaseType(type)
                    .filter(item => !excludedItems.has(item.Name));
                const item = getRandomItem(pool);
                if (item) selectedLoadoutItems.push({ type, item });
            });

            const selectedLoadoutImageUrls = selectedLoadoutItems
                .map(({ type, item }) => getCachedDisplayImageUrl(type, item.Name));

            for (let index = 0; index < getStratagemSlotCount(); index++) {
                const item = selectedStratagems[index];
                renderStratagemSlot(
                    document.getElementById(`slot-${index + 1}`),
                    index + 1,
                    item?.Name || '',
                    item ? getItemImageUrl('스트라타젬', item.Name) : ''
                );
            }

            const selectedLoadoutMap = new Map(
                selectedLoadoutItems.map(({ type, item }, index) => [type, { item, imgUrl: selectedLoadoutImageUrls[index] }])
            );
            ['방어구', '주 무기', '보조 무기', '투척 무기'].forEach(type => {
                const selected = selectedLoadoutMap.get(type);
                renderLoadoutBox(type, selected?.item?.Name || '', selected?.imgUrl || '');
            });
            syncCurrentLoadoutToApp();
        }

        fetch('https://hd2.local/database.json')
            .then(res => res.json())
            .then(data => {
                dbData = data;
                warmupImageCache(data)
